# Pins the Docker Engine API version docker-java's initial handshake uses.
# Without this, every Testcontainers-backed test on this project's
# self-hosted CI runner (infra/azure/ci-runner/) fails outright:
# `UnixSocketClientProviderStrategy`/`EnvironmentAndSystemPropertyClientProviderStrategy`
# both hardcode API 1.32 for their first handshake, and this runner's
# freshly-installed Docker Engine (29.7.2 as of provisioning) rejects
# anything below its own minimum (1.40) with a hard 400 rather than
# negotiating down -- confirmed live, not guessed: DOCKER_API_VERSION and
# DOCKER_HOST environment variables were both tried first and neither
# changed the outcome (verified against public testcontainers-java issues
# #11212/#11235 documenting the same Docker 29 break), which is what
# pointed at this classpath-resource mechanism instead -- docker-java's
# own documented config-precedence order puts a classpath
# `docker-java.properties` above environment variables, and only this
# form actually took effect.
#
# On picking the number -- this file first shipped as 1.51 and that was
# wrong, in a way worth recording because the reasoning was backwards.
# 1.51 was chosen by looking only at the CI runner's daemon (Docker 29.7.2,
# range 1.40-1.55) and verifying live *there*. But this is a classpath
# resource, so it applies to everyone who runs these tests, and a
# developer laptop on Docker Desktop 27.4.0 caps out at API 1.47: every
# Testcontainers test on it failed instantly with
# `client version 1.51 is too new. Maximum supported API version is 1.47`
# -- 100 of 107 Java tests, caught only by the full-suite-before-push
# rule. The property that made this fix good (it travels with the code
# instead of living on one runner) is exactly the property that made
# getting it wrong break everybody.
#
# So the value has to sit in the *intersection* of every daemon that
# runs this suite, not inside any single one:
#   CI runner, Docker 29.7.2:  1.40 - 1.55
#   dev laptop, Docker 27.4.0: 1.24 - 1.47
#   intersection:              1.40 - 1.47
# 1.44 sits inside that with margin at both ends: clear of Docker 29's
# 1.40 floor (headroom if a future engine raises its minimum) and well
# under 1.47 (so a laptop a version or two behind still works -- 1.44 is
# satisfied by any Docker Engine from 25.0 onward). Nothing Testcontainers
# does here needs a recent API; these are basic container lifecycle calls
# available for many versions, so the lowest workable value is the safest
# one, not a compromise. **If you raise this, raise the floor of that
# intersection first** -- check the oldest Docker any developer or CI job
# actually runs, not just the newest.
api.version=1.44
