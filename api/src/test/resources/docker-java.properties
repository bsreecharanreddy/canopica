# Pins the Docker Engine API version docker-java's initial handshake uses.
# Without this, every Testcontainers-backed test on this project's
# self-hosted CI runner (infra/azure/ci-runner/) fails outright:
# `UnixSocketClientProviderStrategy`/`EnvironmentAndSystemPropertyClientProviderStrategy`
# both hardcode API 1.32 for their first handshake, and this runner's
# freshly-installed Docker Engine (29.7.2 as of provisioning) rejects
# anything below its own minimum (1.40) with a hard 400 rather than
# negotiating down -- confirmed live, not guessed: DOCKER_API_VERSION and
# DOCKER_HOST environment variables were both tried first and neither
# changed the outcome (verified against public testcontainers-java issues
# #11212/#11235 documenting the same Docker 29 break), which is what
# pointed at this classpath-resource mechanism instead -- docker-java's
# own documented config-precedence order puts a classpath
# `docker-java.properties` above environment variables, and only this
# form actually took effect. 1.51 is comfortably inside this daemon's
# real supported range (1.40-1.55) with headroom either direction.
api.version=1.51
