version: 2

models:
  - name: mart_determination_outcomes
    description: >
      Determination counts and benefit totals grouped by benefit month,
      program, outcome, reason code, and the policy parameter version in
      force -- the contract Task 11's serving layer/semantic model reads.
    tests:
      - no_pii_in_gold
    columns:
      - name: benefit_month
        tests: [not_null]
      - name: program_code
        tests:
          - not_null
          - accepted_values:
              arguments: { values: ["SNAP"] }
      - name: outcome
        tests:
          - not_null
          - accepted_values:
              arguments: { values: ["ELIGIBLE", "DENIED"] }
      - name: reason_code
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "ELIGIBLE"
                  - "GROSS_INCOME_EXCEEDS_LIMIT"
                  - "NET_INCOME_EXCEEDS_LIMIT"
                  - "ZERO_BENEFIT_AMOUNT"
      - name: policy_parameter_version
        tests: [not_null]
      - name: determination_count
        tests: [not_null]
      - name: eligible_count
        tests: [not_null]
      - name: total_benefit_amount
        tests: [not_null]
      - name: average_benefit_amount
        tests: [not_null]

  - name: mart_worker_caseload
    description: Active case_assignment count per worker.
    tests:
      - no_pii_in_gold
    columns:
      - name: worker_key
        tests: [not_null, unique]
      - name: worker_name
        tests: [not_null]
      - name: role
        tests:
          - not_null
          - accepted_values:
              arguments: { values: ["WORKER", "SUPERVISOR", "ADMIN"] }
      - name: active_case_count
        tests: [not_null]
      - name: as_of_date
        tests: [not_null]

  - name: mart_access_review
    description: >
      One row per CASE_VIEWED audit event, joined to whether the viewing
      worker held the case's active assignment.
    tests:
      - no_pii_in_gold
    columns:
      - name: audit_event_key
        tests: [not_null, unique]
      - name: occurred_at
        tests: [not_null]
      - name: worker_key
        tests: [not_null]
      - name: worker_name
        tests: [not_null]
      - name: worker_role
        tests:
          - not_null
          - accepted_values:
              arguments: { values: ["WORKER", "SUPERVISOR", "ADMIN"] }
      - name: program_request_key
        tests:
          - not_null
          - relationships:
              arguments: { to: ref('fct_program_request'), field: program_request_key }
      - name: in_assignment
        tests: [not_null]

  - name: mart_payment_accuracy
    description: >
      Real payment-error-rate reporting (Phase 4 Task 4): `reviewed`/
      `payment_error_amount` are populated from a sampled QC re-derivation
      (fct_payment_error_review) via DeterminationService.reproduce(), not
      the earlier placeholder. A determination never sampled still shows
      `reviewed = false`/`null`.
    tests:
      - no_pii_in_gold
    columns:
      - name: determination_key
        tests:
          - not_null
          - unique
          - relationships:
              arguments: { to: ref('fct_eligibility_determination'), field: determination_key }
      - name: benefit_month
        tests: [not_null]
      - name: program_code
        tests:
          - not_null
          - accepted_values:
              arguments: { values: ["SNAP"] }
      - name: paid_amount
        tests: [not_null]
      - name: reviewed
        tests: [not_null]

  - name: mart_fairness_audit
    description: >
      Disparate-impact ratio (EEOC four-fifths-rule shape) per (model,
      demographic_axis, demographic_slice, outcome_axis). Aggregate only --
      no determination_key or person_key alongside a demographic value, by
      design (Phase 4 plan constraint 23), so no_pii_in_gold doesn't apply
      here the way it does to a per-determination mart: this mart's safety
      comes from being genuinely aggregate, not from the name-based column
      check that test performs. Shared by a CI gate (fails a merge on a
      regression below 0.8) and a Power BI/Metabase page (roadmap §3.3).
      model = 'rules_engine' as of Phase 4 Task 1; 'fraud_triage' added
      Task 3.
    columns:
      - name: audit_row_key
        tests: [not_null, unique]
      - name: as_of_date
        tests: [not_null]
      - name: model
        tests:
          - not_null
          - accepted_values:
              arguments: { values: ["rules_engine", "fraud_triage"] }
      - name: demographic_axis
        tests:
          - not_null
          - accepted_values:
              arguments: { values: ["race", "hispanic_origin"] }
      - name: demographic_slice
        tests: [not_null]
      - name: outcome_axis
        tests: [not_null]
      - name: total_count
        tests: [not_null]
      - name: favorable_count
        tests: [not_null]
      - name: selection_rate
        tests: [not_null]
      - name: disparate_impact_ratio
        # Nullable: no reference rate exists when every slice in a model/axis/outcome group is
        # too small to anchor one (mart_fairness_audit.sql's reference CTE) -- an honest "not
        # enough data yet," not a bug.
      - name: sample_size_adequate
        tests: [not_null]

  - name: mart_processing_timeliness
    description: >
      One row per determination, against SNAP's real 30-day/7-day
      processing standards (7 CFR 273.2), now that is_expedited (Task 6)
      is real.
    tests:
      - no_pii_in_gold
    columns:
      - name: determination_key
        tests:
          - not_null
          - unique
          - relationships:
              arguments: { to: ref('fct_eligibility_determination'), field: determination_key }
      - name: program_request_key
        tests:
          - not_null
          - relationships:
              arguments: { to: ref('fct_program_request'), field: program_request_key }
      - name: program_code
        tests:
          - not_null
          - accepted_values:
              arguments: { values: ["SNAP"] }
      - name: is_expedited
        tests: [not_null]
      - name: submitted_at
        tests: [not_null]
      - name: decided_at
        tests: [not_null]
      - name: processing_days
        tests: [not_null]
      - name: standard_days
        tests:
          - not_null
          - accepted_values:
              arguments: { values: [7, 30] }
      - name: missed_standard
        tests: [not_null]

  - name: mart_notice_outcomes
    description: >
      Notice counts grouped by notice month, notice type, and status
      (Phase 4 Task 8) -- feeds the notice-rejection-rate metric. No
      notice content/validation/approver columns reach this mart; only
      the counts a rejection-rate ratio needs.
    tests:
      - no_pii_in_gold
    columns:
      - name: notice_month
        tests: [not_null]
      - name: notice_type
        tests:
          - not_null
          - accepted_values:
              arguments: { values: ["APPROVAL", "DENIAL", "PENDING_VERIFICATION"] }
      - name: status
        tests:
          - not_null
          - accepted_values:
              arguments: { values: ["DRAFT", "APPROVED", "REJECTED", "SENT"] }
      - name: notice_count
        tests: [not_null]
