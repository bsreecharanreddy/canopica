version: 2

sources:
  - name: bronze
    description: >
      Append-only Delta landings of the operational tables, written by
      canopica_data.ingestion.extract.extract_to_bronze. No reshaping happens
      here (roadmap §3.4.2) -- duplicates across ingestion batches are
      expected; silver deduplicates on the natural key and the latest
      _ingested_at.
    meta:
      external_location: "delta_scan('{{ env_var('CANOPICA_WAREHOUSE_ROOT', '../../warehouse') }}/bronze/{name}')"
    tables:
      - name: person
      - name: household
      - name: household_member
      - name: application
      - name: program_request
      - name: eligibility_determination
      - name: policy_parameter_set
      - name: policy_parameter
      - name: worker
      - name: case_assignment
      - name: verification
      - name: verification_response
      - name: benefit_month
      - name: audit_event
      - name: person_pii_tokens
      - name: fraud_risk_score
