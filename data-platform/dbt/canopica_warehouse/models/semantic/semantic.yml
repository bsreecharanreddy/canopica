version: 2

models:
  - name: metricflow_time_spine
    description: >
      Day-granularity time spine MetricFlow requires to exist somewhere in
      the project before it will parse semantic_models.yml. Not a gold
      mart -- support infrastructure for the semantic layer itself.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day
        tests: [not_null, unique]
