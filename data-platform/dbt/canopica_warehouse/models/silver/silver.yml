version: 2

models:
  - name: dim_person
    description: One row per person, deduplicated to the latest bronze landing.
    columns:
      - name: person_key
        tests: [not_null, unique]
        meta: { classification: PUBLIC }
      - name: ssn_token
        tests: [not_null]
        meta: { classification: SENSITIVE }
      - name: birth_year
        tests: [not_null]
        meta: { classification: SENSITIVE }
      - name: sex
        meta: { classification: SENSITIVE }
      - name: race
        # Nullable by design -- a real applicant may decline (7 CFR 272.6). See Phase 4 design
        # doc §2.1/Task 1 plan; the accepted_values list mirrors V22__person_demographics.sql's
        # own CHECK constraint.
        tests:
          - accepted_values:
              arguments:
                values: ['WHITE', 'BLACK_OR_AFRICAN_AMERICAN', 'AMERICAN_INDIAN_OR_ALASKA_NATIVE',
                         'ASIAN', 'NATIVE_HAWAIIAN_OR_PACIFIC_ISLANDER', 'SOME_OTHER_RACE',
                         'TWO_OR_MORE_RACES']
              config: { where: "race is not null" }
        meta: { classification: SENSITIVE }
      - name: hispanic_origin
        meta: { classification: SENSITIVE }
      - name: is_us_citizen
        tests: [not_null]
        meta: { classification: SENSITIVE }
      - name: name_token
        tests: [not_null]
        meta: { classification: SENSITIVE }
      - name: loaded_at
        tests: [not_null]
        meta: { classification: PUBLIC }

  - name: dim_household
    description: One row per household (case), deduplicated to the latest bronze landing.
    columns:
      - name: household_key
        tests: [not_null, unique]
        meta: { classification: PUBLIC }
      - name: head_person_key
        tests:
          - not_null
          - relationships:
              arguments: { to: ref('dim_person'), field: person_key }
        meta: { classification: PUBLIC }
      - name: county
        tests: [not_null]
        meta: { classification: PUBLIC }
      - name: state
        tests: [not_null]
        meta: { classification: PUBLIC }
      - name: zip_code
        tests: [not_null]
        meta: { classification: SENSITIVE }
      - name: loaded_at
        tests: [not_null]
        meta: { classification: PUBLIC }

  - name: dim_policy_parameter_set
    description: SCD-2 dimension over the immutable, effective-dated policy_parameter_set rows.
    columns:
      - name: parameter_set_key
        tests: [not_null, unique]
        meta: { classification: PUBLIC }
      - name: version_label
        tests: [not_null]
        meta: { classification: PUBLIC }
      - name: program_code
        tests:
          - not_null
          - accepted_values:
              arguments: { values: ["SNAP"] }
        meta: { classification: PUBLIC }
      - name: valid_from
        tests: [not_null]
        meta: { classification: PUBLIC }
      - name: valid_to
        tests: [not_null]
        meta: { classification: PUBLIC }
      - name: is_current
        tests: [not_null]
        meta: { classification: PUBLIC }
      - name: source_citation
        tests: [not_null]
        meta: { classification: PUBLIC }

  - name: fct_program_request
    description: One row per program request, deduplicated to the latest bronze landing.
    columns:
      - name: program_request_key
        tests: [not_null, unique]
        meta: { classification: PUBLIC }
      - name: application_key
        tests: [not_null]
        meta: { classification: PUBLIC }
      - name: program_code
        tests:
          - not_null
          - accepted_values:
              arguments: { values: ["SNAP"] }
        meta: { classification: PUBLIC }
      - name: status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  ["SUBMITTED", "PENDING_VERIFICATION", "DETERMINED", "WITHDRAWN"]
        meta: { classification: PUBLIC }
      - name: requested_on
        tests: [not_null]
        meta: { classification: PUBLIC }
      - name: is_expedited
        tests: [not_null]
        meta: { classification: PUBLIC }
      - name: loaded_at
        tests: [not_null]
        meta: { classification: PUBLIC }

  - name: fct_eligibility_determination
    description: One row per determination, deduplicated to the latest bronze landing.
    columns:
      - name: determination_key
        tests: [not_null, unique]
        meta: { classification: PUBLIC }
      - name: program_request_key
        tests:
          - not_null
          - relationships:
              arguments: { to: ref('fct_program_request'), field: program_request_key }
        meta: { classification: PUBLIC }
      - name: parameter_set_key
        tests:
          - not_null
          - relationships:
              arguments: { to: ref('dim_policy_parameter_set'), field: parameter_set_key }
        meta: { classification: PUBLIC }
      - name: benefit_month
        tests: [not_null]
        meta: { classification: PUBLIC }
      - name: as_of_date
        tests: [not_null]
        meta: { classification: PUBLIC }
      - name: eligible
        tests: [not_null]
        meta: { classification: SENSITIVE }
      - name: benefit_amount
        tests: [not_null]
        meta: { classification: SENSITIVE }
      - name: reason_code
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "ELIGIBLE"
                  - "GROSS_INCOME_EXCEEDS_LIMIT"
                  - "NET_INCOME_EXCEEDS_LIMIT"
                  - "ZERO_BENEFIT_AMOUNT"
        meta: { classification: PUBLIC }
      - name: policy_parameter_version
        tests: [not_null]
        meta: { classification: PUBLIC }
      - name: decided_at
        tests: [not_null]
        meta: { classification: PUBLIC }
      - name: loaded_at
        tests: [not_null]
        meta: { classification: PUBLIC }

  - name: dim_worker
    description: One row per worker (caseworker/supervisor/admin), deduplicated to the latest bronze landing.
    columns:
      - name: worker_key
        tests: [not_null, unique]
        meta: { classification: PUBLIC }
      - name: worker_name
        tests: [not_null]
        meta: { classification: SENSITIVE }
      - name: email
        tests: [not_null, unique]
        meta: { classification: SENSITIVE }
      - name: role
        tests:
          - not_null
          - accepted_values:
              arguments: { values: ["WORKER", "SUPERVISOR", "ADMIN"] }
        meta: { classification: PUBLIC }
      - name: keycloak_subject
        meta: { classification: SENSITIVE }
      - name: loaded_at
        tests: [not_null]
        meta: { classification: PUBLIC }

  - name: dim_program
    description: Static dimension over the programs this system determines eligibility for (today, just SNAP).
    columns:
      - name: program_code
        tests:
          - not_null
          - unique
          - accepted_values:
              arguments: { values: ["SNAP"] }
        meta: { classification: PUBLIC }
      - name: program_name
        tests: [not_null]
        meta: { classification: PUBLIC }
      - name: statutory_citation
        tests: [not_null]
        meta: { classification: PUBLIC }

  - name: fct_application
    description: One row per application, deduplicated to the latest bronze landing.
    columns:
      - name: application_key
        tests: [not_null, unique]
        meta: { classification: PUBLIC }
      - name: household_key
        tests:
          - not_null
          - relationships:
              arguments: { to: ref('dim_household'), field: household_key }
        meta: { classification: PUBLIC }
      - name: submitted_at
        tests: [not_null]
        meta: { classification: PUBLIC }
      - name: channel
        tests:
          - not_null
          - accepted_values:
              arguments: { values: ["ONLINE", "PHONE", "PAPER", "IN_PERSON"] }
        meta: { classification: PUBLIC }
      - name: loaded_at
        tests: [not_null]
        meta: { classification: PUBLIC }

  - name: fct_household_member
    description: >
      Bridges household_key <-> person_key. Built in Phase 4 Task 1 to resolve which person's
      demographics a determination's household maps to for mart_fairness_audit -- bronze has
      carried household_member since Phase 1b, but no silver model existed on top of it before.
    columns:
      - name: household_member_key
        tests: [not_null, unique]
        meta: { classification: PUBLIC }
      - name: household_key
        tests:
          - not_null
          - relationships:
              arguments: { to: ref('dim_household'), field: household_key }
        meta: { classification: PUBLIC }
      - name: person_key
        tests:
          - not_null
          - relationships:
              arguments: { to: ref('dim_person'), field: person_key }
        meta: { classification: PUBLIC }
      - name: relationship
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SELF', 'SPOUSE', 'CHILD', 'PARENT', 'OTHER_RELATIVE', 'UNRELATED']
        meta: { classification: PUBLIC }
      - name: effective_from
        tests: [not_null]
        meta: { classification: PUBLIC }
      - name: effective_to
        meta: { classification: PUBLIC }
      - name: loaded_at
        tests: [not_null]
        meta: { classification: PUBLIC }

  - name: fct_fraud_risk_score
    description: >
      One row per scored determination, deduplicated to the latest bronze landing (a mutable row --
      Task 3's own review fields update in place). Built in Phase 4 Task 3 for mart_fairness_audit's
      own fraud_triage axis.
    columns:
      - name: fraud_risk_score_key
        tests: [not_null, unique]
        meta: { classification: PUBLIC }
      - name: determination_key
        tests:
          - not_null
          - relationships:
              arguments: { to: ref('fct_eligibility_determination'), field: determination_key }
        meta: { classification: PUBLIC }
      - name: program_request_key
        tests:
          - not_null
          - relationships:
              arguments: { to: ref('fct_program_request'), field: program_request_key }
        meta: { classification: PUBLIC }
      - name: score
        tests: [not_null]
        meta: { classification: SENSITIVE }
      - name: model_version
        tests: [not_null]
        meta: { classification: PUBLIC }
      - name: scored_at
        tests: [not_null]
        meta: { classification: PUBLIC }

  - name: fct_payment_error_review
    description: >
      One row per sampled determination, deduplicated to the latest bronze landing (a mutable row --
      Task 5's own review fields update in place). Built in Phase 4 Task 4 for mart_payment_accuracy's
      real reviewed/payment_error_amount columns.
    columns:
      - name: payment_error_review_key
        tests: [not_null, unique]
        meta: { classification: PUBLIC }
      - name: determination_key
        tests:
          - not_null
          - unique
          - relationships:
              arguments: { to: ref('fct_eligibility_determination'), field: determination_key }
        meta: { classification: PUBLIC }
      - name: original_amount
        tests: [not_null]
        meta: { classification: SENSITIVE }
      - name: reproduced_amount
        tests: [not_null]
        meta: { classification: SENSITIVE }
      - name: error_amount
        tests: [not_null]
        meta: { classification: SENSITIVE }
      - name: sampled_at
        tests: [not_null]
        meta: { classification: PUBLIC }
      - name: review_outcome
        tests:
          - accepted_values:
              arguments:
                values: ['CONFIRMED_ERROR', 'DISMISSED']
              config: { where: "review_outcome is not null" }
        meta: { classification: SENSITIVE }
      - name: loaded_at
        tests: [not_null]
        meta: { classification: PUBLIC }

  - name: fct_verification
    description: One row per verification checklist item, deduplicated to the latest bronze landing.
    columns:
      - name: verification_key
        tests: [not_null, unique]
        meta: { classification: PUBLIC }
      - name: program_request_key
        tests:
          - not_null
          - relationships:
              arguments: { to: ref('fct_program_request'), field: program_request_key }
        meta: { classification: PUBLIC }
      - name: data_element
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  ["IDENTITY", "RESIDENCY", "INCOME", "SHELTER_COST", "MEDICAL_EXPENSE",
                   "DISABILITY", "HOUSEHOLD_COMPOSITION"]
        meta: { classification: PUBLIC }
      - name: status
        tests:
          - not_null
          - accepted_values:
              arguments: { values: ["OUTSTANDING", "RECEIVED", "WAIVED"] }
        meta: { classification: PUBLIC }
      - name: due_on
        tests: [not_null]
        meta: { classification: PUBLIC }
      - name: satisfied_on
        meta: { classification: PUBLIC }
      - name: loaded_at
        tests: [not_null]
        meta: { classification: PUBLIC }

  - name: fct_benefit_month
    description: One row per benefit month, deduplicated to the latest bronze landing.
    columns:
      - name: benefit_month_key
        tests: [not_null, unique]
        meta: { classification: PUBLIC }
      - name: program_request_key
        tests:
          - not_null
          - relationships:
              arguments: { to: ref('fct_program_request'), field: program_request_key }
        meta: { classification: PUBLIC }
      - name: benefit_month
        tests: [not_null]
        meta: { classification: PUBLIC }
      - name: loaded_at
        tests: [not_null]
        meta: { classification: PUBLIC }

  - name: fct_audit_event
    description: One row per audit-log event, deduplicated to the latest bronze landing.
    columns:
      - name: audit_event_key
        tests: [not_null, unique]
        meta: { classification: PUBLIC }
      - name: occurred_at
        tests: [not_null]
        meta: { classification: PUBLIC }
      - name: event_type
        tests:
          - not_null
          # Mirrors audit_event's own CHECK constraint (V6, widened by V16,
          # V18/V19, and Phase 4's V24/V25/V27/V28). These three have to
          # move together -- the migration, canopica.api.audit.
          # AuditEventType, and this list -- or the first event of a new
          # type turns this test red long after the change that introduced
          # it. This has now happened twice: Phase 3 (V18/V19) widened the
          # other two but never this list, caught live running Phase 4
          # Task 1's dbt build against the shared local dev Postgres; and
          # Phase 4 itself repeated the identical mistake for its own four
          # new event types (FRAUD_FLAG_RAISED/REVIEWED, QC_DISCREPANCY_
          # FLAGGED, QC_REVIEW_COMPLETED) -- caught live running Task 10's
          # own end-to-end verification, the first time any of these four
          # event types had ever actually been written in this shared dev
          # database. A fresh CI database hadn't hit either gap yet, but
          # any real usage eventually would have.
          - accepted_values:
              arguments:
                values:
                  [
                    "APPLICATION_SUBMITTED",
                    "DETERMINATION_MADE",
                    "CASE_VIEWED",
                    "VERIFICATION_UPDATED",
                    "POLICY_PARAMETER_PUBLISHED",
                    "DOCUMENT_UPLOADED",
                    "DOCUMENT_CLASSIFIED",
                    "NOTICE_DRAFTED",
                    "NOTICE_APPROVED",
                    "NOTICE_SENT",
                    "FRAUD_FLAG_RAISED",
                    "FRAUD_FLAG_REVIEWED",
                    "QC_DISCREPANCY_FLAGGED",
                    "QC_REVIEW_COMPLETED",
                  ]
        meta: { classification: PUBLIC }
      - name: actor_id
        tests: [not_null]
        meta: { classification: SENSITIVE }
      - name: subject_type
        tests: [not_null]
        meta: { classification: PUBLIC }
      - name: subject_id
        tests: [not_null]
        meta: { classification: PUBLIC }
      - name: payload
        meta: { classification: SENSITIVE }
      - name: loaded_at
        tests: [not_null]
        meta: { classification: PUBLIC }

  - name: fct_notice
    description: >
      One row per notice, deduplicated to the latest bronze landing (a
      mutable row -- Task 8's own mart_notice_outcomes needs status
      counts, not the drafted content). Built in Phase 4 Task 8.
    columns:
      - name: notice_key
        tests: [not_null, unique]
        meta: { classification: PUBLIC }
      - name: program_request_key
        tests:
          - not_null
          - relationships:
              arguments: { to: ref('fct_program_request'), field: program_request_key }
        meta: { classification: PUBLIC }
      - name: notice_type
        tests:
          - not_null
          - accepted_values:
              arguments: { values: ["APPROVAL", "DENIAL", "PENDING_VERIFICATION"] }
        meta: { classification: PUBLIC }
      - name: status
        tests:
          - not_null
          - accepted_values:
              arguments: { values: ["DRAFT", "APPROVED", "REJECTED", "SENT"] }
        meta: { classification: PUBLIC }
      - name: created_at
        tests: [not_null]
        meta: { classification: PUBLIC }
      - name: loaded_at
        tests: [not_null]
        meta: { classification: PUBLIC }
