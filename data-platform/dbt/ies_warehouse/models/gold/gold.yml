version: 2

models:
  - name: mart_determination_outcomes
    description: >
      Determination counts and benefit totals grouped by benefit month,
      program, outcome, reason code, and the policy parameter version in
      force -- the contract Task 11's serving layer/semantic model reads.
    tests:
      - no_pii_in_gold
    columns:
      - name: benefit_month
        tests: [not_null]
      - name: program_code
        tests:
          - not_null
          - accepted_values:
              arguments: { values: ["SNAP"] }
      - name: outcome
        tests:
          - not_null
          - accepted_values:
              arguments: { values: ["ELIGIBLE", "DENIED"] }
      - name: reason_code
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "ELIGIBLE"
                  - "GROSS_INCOME_EXCEEDS_LIMIT"
                  - "NET_INCOME_EXCEEDS_LIMIT"
                  - "ZERO_BENEFIT_AMOUNT"
      - name: policy_parameter_version
        tests: [not_null]
      - name: determination_count
        tests: [not_null]
      - name: eligible_count
        tests: [not_null]
      - name: total_benefit_amount
        tests: [not_null]
      - name: average_benefit_amount
        tests: [not_null]

  - name: mart_worker_caseload
    description: Active case_assignment count per worker.
    tests:
      - no_pii_in_gold
    columns:
      - name: worker_key
        tests: [not_null, unique]
      - name: worker_name
        tests: [not_null]
      - name: role
        tests:
          - not_null
          - accepted_values:
              arguments: { values: ["WORKER", "SUPERVISOR", "ADMIN"] }
      - name: active_case_count
        tests: [not_null]

  - name: mart_access_review
    description: >
      One row per CASE_VIEWED audit event, joined to whether the viewing
      worker held the case's active assignment.
    tests:
      - no_pii_in_gold
    columns:
      - name: audit_event_key
        tests: [not_null, unique]
      - name: occurred_at
        tests: [not_null]
      - name: worker_key
        tests: [not_null]
      - name: worker_name
        tests: [not_null]
      - name: worker_role
        tests:
          - not_null
          - accepted_values:
              arguments: { values: ["WORKER", "SUPERVISOR", "ADMIN"] }
      - name: program_request_key
        tests:
          - not_null
          - relationships:
              arguments: { to: ref('fct_program_request'), field: program_request_key }
      - name: in_assignment
        tests: [not_null]

  - name: mart_payment_accuracy
    description: >
      Placeholder shape for Phase 4's QC / Payment Error Rate Assistant --
      `reviewed`/`payment_error_amount` are not real logic yet, see the
      model's own doc comment.
    tests:
      - no_pii_in_gold
    columns:
      - name: determination_key
        tests:
          - not_null
          - unique
          - relationships:
              arguments: { to: ref('fct_eligibility_determination'), field: determination_key }
      - name: benefit_month
        tests: [not_null]
      - name: program_code
        tests:
          - not_null
          - accepted_values:
              arguments: { values: ["SNAP"] }
      - name: paid_amount
        tests: [not_null]
      - name: reviewed
        tests: [not_null]

  - name: mart_processing_timeliness
    description: >
      One row per determination, against SNAP's real 30-day/7-day
      processing standards (7 CFR 273.2), now that is_expedited (Task 6)
      is real.
    tests:
      - no_pii_in_gold
    columns:
      - name: determination_key
        tests:
          - not_null
          - unique
          - relationships:
              arguments: { to: ref('fct_eligibility_determination'), field: determination_key }
      - name: program_request_key
        tests:
          - not_null
          - relationships:
              arguments: { to: ref('fct_program_request'), field: program_request_key }
      - name: is_expedited
        tests: [not_null]
      - name: submitted_at
        tests: [not_null]
      - name: decided_at
        tests: [not_null]
      - name: processing_days
        tests: [not_null]
      - name: standard_days
        tests:
          - not_null
          - accepted_values:
              arguments: { values: [7, 30] }
      - name: missed_standard
        tests: [not_null]
