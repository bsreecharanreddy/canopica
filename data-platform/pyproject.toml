[project]
name = "ies-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sree", email = "309448042+reddyscb@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "connectorx>=0.4.5",
    "dbt-core>=1.12.3",
    "dbt-duckdb>=1.11.0",
    "deltalake>=1.6.2",
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "numpy>=2.5.2",
    "polars>=1.43.2",
    "psycopg[binary]>=3.3.4",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.4",
    "testcontainers>=4.15.0",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PL", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Magic-number comparisons against expected fixture values are normal and
# readable in test assertions; naming every one as a constant hurts more
# than it helps.
"tests/**/*.py" = ["PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs a running Postgres (Docker)",
  "e2e: needs the full Compose stack",
]
