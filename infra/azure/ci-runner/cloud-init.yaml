#cloud-config
# Installs everything the runner needs to *exist*, but deliberately does
# NOT run config.sh -- GitHub's runner registration token is short-lived
# (~1 hour) and there's no way to hand cloud-init a fresh one at
# `terraform apply` time. Registration is the one manual, one-time step
# README.md documents (via `az vm run-command invoke`, which needs no
# public IP or SSH access). After that, the runner is a systemd service
# and starts automatically on every VM boot -- ci.yml's `az vm start`
# never re-registers it.
package_update: true
package_upgrade: true

write_files:
  # Runs before EVERY job this runner executes, via the runner's own
  # ACTIONS_RUNNER_HOOK_JOB_STARTED mechanism (registered in .env below).
  #
  # Why this exists: ci.yml was written against GitHub-hosted `ubuntu-latest`,
  # where every job gets a brand-new VM and cleanup is free because there is
  # nothing to clean. This runner is one long-lived VM, so containers from
  # job N are still running when job N+1 starts, and `docker compose up`
  # reuses them rather than starting fresh. Run `32927971610` is the proof:
  # `e2e-ai` began with `infra-ollama-1 Running` + `infra-opensearch-1
  # Running` left over from `ai-eval`, then `e2e-data-platform` began with
  # `jaeger`/`api`/`keycloak`/`postgres` still Running on top of *those* --
  # ~13 containers on a 7.8GB box. Both jobs then failed for the same
  # underlying reason wearing different clothes: ollama's healthcheck timed
  # out (`container infra-ollama-1 is unhealthy`) and Airflow's gunicorn
  # master never answered within 120s. Whichever container loses the memory
  # race fails that run, which is exactly why this kept presenting as a new,
  # unrelated bug each time.
  #
  # Deliberately a runner hook rather than a cleanup step in each job: it
  # covers all 12 current jobs *and every job added later*, with nothing to
  # remember. A per-job step is the same class of "you have to remember it"
  # gap that canopica-task-checkpoint's step 5 exists to close.
  #
  # Deliberately at job *start*, not job end: an end-hook never runs when a
  # job is cancelled or the runner drops its connection mid-run (both have
  # happened here -- see STATUS.md's SNAT idle-timeout row). Cleaning up
  # front guarantees a clean slate no matter how the previous job ended.
  #
  # **Containers were only the first of four things that accumulate here,
  # and scoping this hook to them was an incomplete fix that failed on the
  # very next run.** The first version pruned containers and networks only,
  # reasoning that the proven failure was *memory* and that volumes and
  # images cost disk rather than RAM. True, and beside the point: on a
  # long-lived VM the disk fills too. Run `32932666191` proved the memory
  # half fixed (jobs now start with ~6.9GB available, against 657MB before)
  # and then failed two jobs on `No space left on device` -- the root
  # filesystem at **100%, 184MB free**, holding 20.7GB of images of which
  # 16.94GB was unreferenced, plus 2.94GB of build cache and 896MB of dead
  # volumes. A one-off prune reclaimed 20.2GB and took the disk to 35%.
  # The lesson worth keeping: "GitHub-hosted runners gave every job a clean
  # machine" is a statement about *all* Docker state, not just containers,
  # and fixing one form of it while naming the others as deliberately
  # out-of-scope is how a fix looks complete and isn't.
  #
  # Images and build cache prune on *disk pressure* rather than every job,
  # because a full prune forces every image to rebuild from scratch on the
  # next job and that is real wall-clock. Keep the layer cache while there
  # is room; discard it only when finishing the job matters more than
  # finishing it quickly. Containers, networks and volumes prune
  # unconditionally -- those are cheap to recreate and none of them carries
  # state any job should be inheriting.
  - path: /opt/actions-runner/job-started-hook.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Pre-job cleanup for a LONG-LIVED runner VM. On GitHub-hosted runners
      # every job got a fresh machine, so nothing here was ever needed; on one
      # persistent VM, four separate things accumulate across jobs and each has
      # taken CI down at least once: containers (memory), then images, build
      # cache and volumes (disk).
      # No `-e`: this hook must never fail a job. A cleanup that cannot run
      # is worth a log line, not a red build.
      set -uo pipefail

      leftovers=$$(docker ps -aq 2>/dev/null || true)
      if [ -n "$${leftovers}" ]; then
        echo "job-started-hook: removing $$(echo "$${leftovers}" | wc -l) container(s) left by a previous job"
        docker rm -f $${leftovers} >/dev/null 2>&1 || true
      fi
      docker network prune -f >/dev/null 2>&1 || true
      docker volume prune -f >/dev/null 2>&1 || true

      avail_gb=$$(df --output=avail -BG / 2>/dev/null | tail -1 | tr -dc "0-9")
      MIN_FREE_GB=12
      if [ "$${avail_gb:-0}" -lt "$${MIN_FREE_GB}" ]; then
        echo "job-started-hook: $${avail_gb}GB free is under the $${MIN_FREE_GB}GB floor -- pruning all unused images and build cache"
        docker image prune -af >/dev/null 2>&1 || true
        docker builder prune -af >/dev/null 2>&1 || true
      else
        docker image prune -f >/dev/null 2>&1 || true
      fi

      echo "job-started-hook: memory available at job start:"
      free -h || true

packages:
  - ca-certificates
  - curl
  - jq
  # unzip/zip: absent from this minimal Ubuntu cloud image (GitHub-hosted
  # ubuntu-latest bundles them, so this gap only showed up once real jobs
  # started running here) -- unzip specifically is a hard dependency of
  # ci.yml's `hashicorp/setup-terraform@v4` step, which failed outright
  # on "Unable to locate executable file: unzip" the first time the
  # `terraform` job ran on this runner (run 32923099481).
  - unzip
  - zip

runcmd:
  # Docker Engine, official convenience script -- same install path
  # Docker's own docs recommend, not a distro-packaged docker.io build
  # that tends to lag upstream.
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker ${admin_username}
  - systemctl enable --now docker

  # Latest runner release, fetched at boot rather than pinned to a version
  # baked into this file -- this VM is long-lived (started/stopped across
  # months, not rebuilt per run, unlike a normal ephemeral CI container),
  # so a version pinned here would silently go stale. The one-time
  # registration step in README.md is the natural point to notice an
  # update is available anyway.
  - mkdir -p /opt/actions-runner

  # Registers the pre-job cleanup hook written above. `.env` is the runner's
  # own documented mechanism for environment it should read at job-dispatch
  # time, and unlike the `DOCKER_API_VERSION` attempt this file used to
  # carry (see the comment further down), this variable is read by the
  # runner process itself -- exactly what `.env` is for -- not by a library
  # deep inside a job's own process tree.
  - echo 'ACTIONS_RUNNER_HOOK_JOB_STARTED=/opt/actions-runner/job-started-hook.sh' >> /opt/actions-runner/.env

  # 4GB of swap. Not a fix for anything -- the container-cleanup hook above
  # is the actual fix -- but this box has 7.8GB and *zero* swap, against a
  # ci.yml originally written for GitHub-hosted runners with 16GB. Swap
  # turns the failure mode at the margin from a hard healthcheck timeout
  # into a slow job that still passes. 4GB against 32GB of disk (~9GB free
  # after images) leaves real headroom; grow the disk before growing this.
  - fallocate -l 4G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab

  # Testcontainers-Java (api/pom.xml's pinned testcontainers.version)
  # ships a Docker-client detection probe that hardcodes API version 1.32
  # for its initial handshake -- a known upstream testcontainers-java/
  # docker-java gap against Docker Engine releases this recent (29.7.2,
  # installed fresh via get.docker.com below, minimum supported API 1.40).
  # Fixed in the repo itself, not here: `DOCKER_API_VERSION`/`DOCKER_HOST`
  # environment variables were tried first (a `.env` file used to live at
  # this exact point in this script) and neither changed the outcome --
  # confirmed live, by testing both directly on this VM against the real
  # failing test, not assumed. Every strategy docker-java tried, including
  # `EnvironmentAndSystemPropertyClientProviderStrategy` (the one meant to
  # read exactly these env vars), failed with the identical hardcoded-1.32
  # error, which means the handshake this daemon rejects happens before
  # docker-java ever consults them. `api/src/test/resources/docker-
  # java.properties` (a classpath resource, docker-java's own documented
  # config mechanism, one level docker-java's config loader consults
  # earlier) is what actually worked when tested the same way -- see that
  # file's own comment for the fuller story. A VM-level fix would only
  # have helped this one project anyway; the classpath resource travels
  # with the code, so it works for anyone who clones this repo and runs
  # its tests locally too, not just on this specific runner.
  - |
    RUNNER_VERSION=$(curl -fsSL https://api.github.com/repos/actions/runner/releases/latest | jq -r '.tag_name' | sed 's/^v//')
    curl -fsSL -o /opt/actions-runner/runner.tar.gz \
      "https://github.com/actions/runner/releases/download/v$${RUNNER_VERSION}/actions-runner-linux-x64-$${RUNNER_VERSION}.tar.gz"
  - tar xzf /opt/actions-runner/runner.tar.gz -C /opt/actions-runner
  - /opt/actions-runner/bin/installdependencies.sh
  - chown -R ${admin_username}:${admin_username} /opt/actions-runner
