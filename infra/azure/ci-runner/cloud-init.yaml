#cloud-config
# Installs everything the runner needs to *exist*, but deliberately does
# NOT run config.sh -- GitHub's runner registration token is short-lived
# (~1 hour) and there's no way to hand cloud-init a fresh one at
# `terraform apply` time. Registration is the one manual, one-time step
# README.md documents (via `az vm run-command invoke`, which needs no
# public IP or SSH access). After that, the runner is a systemd service
# and starts automatically on every VM boot -- ci.yml's `az vm start`
# never re-registers it.
package_update: true
package_upgrade: true

write_files:
  # Runs before EVERY job this runner executes, via the runner's own
  # ACTIONS_RUNNER_HOOK_JOB_STARTED mechanism (registered in .env below).
  #
  # Why this exists: ci.yml was written against GitHub-hosted `ubuntu-latest`,
  # where every job gets a brand-new VM and cleanup is free because there is
  # nothing to clean. This runner is one long-lived VM, so containers from
  # job N are still running when job N+1 starts, and `docker compose up`
  # reuses them rather than starting fresh. Run `32927971610` is the proof:
  # `e2e-ai` began with `infra-ollama-1 Running` + `infra-opensearch-1
  # Running` left over from `ai-eval`, then `e2e-data-platform` began with
  # `jaeger`/`api`/`keycloak`/`postgres` still Running on top of *those* --
  # ~13 containers on a 7.8GB box. Both jobs then failed for the same
  # underlying reason wearing different clothes: ollama's healthcheck timed
  # out (`container infra-ollama-1 is unhealthy`) and Airflow's gunicorn
  # master never answered within 120s. Whichever container loses the memory
  # race fails that run, which is exactly why this kept presenting as a new,
  # unrelated bug each time.
  #
  # Deliberately a runner hook rather than a cleanup step in each job: it
  # covers all 12 current jobs *and every job added later*, with nothing to
  # remember. A per-job step is the same class of "you have to remember it"
  # gap that canopica-task-checkpoint's step 5 exists to close.
  #
  # Deliberately at job *start*, not job end: an end-hook never runs when a
  # job is cancelled or the runner drops its connection mid-run (both have
  # happened here -- see STATUS.md's SNAT idle-timeout row). Cleaning up
  # front guarantees a clean slate no matter how the previous job ended.
  #
  # **Containers were only the first of four things that accumulate here,
  # and scoping this hook to them was an incomplete fix that failed on the
  # very next run.** The first version pruned containers and networks only,
  # reasoning that the proven failure was *memory* and that volumes and
  # images cost disk rather than RAM. True, and beside the point: on a
  # long-lived VM the disk fills too. Run `32932666191` proved the memory
  # half fixed (jobs now start with ~6.9GB available, against 657MB before)
  # and then failed two jobs on `No space left on device` -- the root
  # filesystem at **100%, 184MB free**, holding 20.7GB of images of which
  # 16.94GB was unreferenced, plus 2.94GB of build cache and 896MB of dead
  # volumes. A one-off prune reclaimed 20.2GB and took the disk to 35%.
  # The lesson worth keeping: "GitHub-hosted runners gave every job a clean
  # machine" is a statement about *all* Docker state, not just containers,
  # and fixing one form of it while naming the others as deliberately
  # out-of-scope is how a fix looks complete and isn't.
  #
  # **What gets pruned is not symmetric, and getting that backwards was the
  # third mistake in this same hook.** The first version of the disk-
  # pressure branch reached for `docker image prune -af`, on the reasoning
  # that "unused" images are reclaimable space. Measuring the VM said
  # otherwise: it held **16 tagged images totalling 20.7GB and zero
  # dangling ones**, and all 16 were base images CI pulls on every run
  # (ollama 8.43GB, three Airflow variants at 3.74GB each, opensearch
  # 2.55GB, metabase 1.81GB, keycloak, grafana, prometheus, postgres...).
  # `-af` would have deleted every one of them -- i.e. deleted precisely
  # the cache the disk was grown from 32GB to 64GB in order to hold, and
  # forced a full ~17GB re-pull on the next run, paying for it twice over
  # in wall-clock and in NAT Gateway data processing. `docker system df`
  # calling that space "reclaimable" is what makes the mistake easy: it
  # counts any image without a *currently running* container, which on an
  # idle runner is all of them.
  #
  # So the split is by what the thing actually costs to recreate:
  #   - Containers, networks, volumes: pruned unconditionally, every job.
  #     Seconds to recreate, and none carries state a job should inherit.
  #   - Build cache: bounded every job. This is the one thing that grows
  #     without limit (5.8GB when measured, 5.7GB of it reclaimable) and
  #     the one whose loss costs a rebuild rather than a re-download.
  #     Bounded rather than emptied, so recent layers survive.
  #   - Tagged images: never pruned on a schedule. They are the cache.
  #
  # `-af` on either survives only in the emergency branch, at a floor low
  # enough that reaching it means something is genuinely wrong -- and even
  # there it is staged (build cache first, re-measure, images only if that
  # was not enough), because the cheap reclaim usually suffices and the
  # expensive one rarely needs to happen at all.
  #
  # Not at risk from any of this, and deliberately so: the Ollama model
  # directory at /opt/ollama-models (~2.3GB of nomic-embed-text +
  # llama3.2:3b). It is a host bind mount, not a Docker volume, so
  # `docker volume prune` cannot see it; it is outside the runner
  # workspace, so actions/checkout's `git clean -ffdx` cannot delete it;
  # and nothing below touches host paths at all.
  - path: /opt/actions-runner/job-started-hook.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Pre-job cleanup for a LONG-LIVED runner VM. On GitHub-hosted runners
      # every job got a fresh machine, so nothing here was ever needed; on one
      # persistent VM, four separate things accumulate across jobs and each has
      # taken CI down at least once: containers (memory), then images, build
      # cache and volumes (disk).
      # No `-e`: this hook must never fail a job. A cleanup that cannot run
      # is worth a log line, not a red build.
      set -uo pipefail

      # actions/checkout's `git clean -ffdx` cannot remove root-owned files,
      # and Ollama runs as root inside its container. OLLAMA_MODELS_DIR
      # keeps the real cache at /opt/ollama-models, outside the workspace,
      # but any job that ever runs `docker compose` without that env var
      # set falls back to the in-workspace default and leaves root-owned
      # junk behind that checkout can never clean on its own -- this took
      # down every job on the runner in run 32994298760 with
      # `EACCES: permission denied, rmdir '.../infra/ollama-models/cache'`.
      # Swept here, with root, before checkout ever runs.
      sudo rm -rf /opt/actions-runner/_work/canopica/canopica/infra/ollama-models 2>/dev/null || true

      leftovers=$$(docker ps -aq 2>/dev/null || true)
      if [ -n "$${leftovers}" ]; then
        echo "job-started-hook: removing $$(echo "$${leftovers}" | wc -l) container(s) left by a previous job"
        docker rm -f $${leftovers} >/dev/null 2>&1 || true
      fi
      docker network prune -f >/dev/null 2>&1 || true
      # `-a`, and it is load-bearing. `docker volume prune -f` alone removes
      # only *anonymous* volumes; Compose's are all named
      # (`infra_postgres-data` and friends), so the plain form silently
      # skipped every volume this project actually creates -- a cleanup
      # that reported success and did nothing. Caught by the failure it
      # caused rather than by review: run `32935635062`'s `e2e-ai` died on
      # `duplicate key value violates unique constraint "worker_email_key"`,
      # which is docs/STATUS.md's known Keycloak-subject-reissue collision
      # -- previously only reachable by hand, and turned into a structural
      # every-run failure here because the operational Postgres volume now
      # outlived the Keycloak container that reseeds against it.
      # Nothing in a volume is a cache worth keeping: they hold operational
      # database state, which is precisely what a job must not inherit.
      docker volume prune -af >/dev/null 2>&1 || true

      # Dangling images only -- rebuild churn from `compose up --build`,
      # never a tagged base image. See the long note above for why `-af`
      # is not what belongs here.
      docker image prune -f >/dev/null 2>&1 || true

      # Bound the build cache rather than emptying it.
      #
      # Two things about this line were checked against the live daemon
      # rather than assumed, and both would otherwise have been silent:
      # `--max-used-space` is Docker 29's flag and the older
      # `--keep-storage` has been REMOVED (not merely deprecated), so the
      # obvious spelling would have failed forever behind the `|| true`.
      # And the budget applies to the *reclaimable* cache, not the total:
      # measured live at 5.803GB total / 1.373GB reclaimable, a 4GB budget
      # correctly pruned nothing, while a 1GB budget reclaimed 483MB and
      # left 889MB. So this is a ceiling on unreferenced cache growth --
      # which is the thing that actually grows without limit -- and not a
      # cap on the number `docker system df` prints.
      docker builder prune -f --max-used-space 4GB >/dev/null 2>&1 || true

      avail_gb=$$(df --output=avail -BG / 2>/dev/null | tail -1 | tr -dc "0-9")
      # 6GB, not the 12GB this used to be. The old floor was set when the
      # disk was 32GB and the branch it guards was believed cheap; at 64GB
      # with the cache-preserving prunes above running every job, tripping
      # this means something is actually wrong, and what it triggers is
      # expensive enough that it should be rare rather than routine.
      EMERGENCY_FREE_GB=6
      if [ "$${avail_gb:-0}" -lt "$${EMERGENCY_FREE_GB}" ]; then
        echo "job-started-hook: EMERGENCY -- only $${avail_gb}GB free, under the $${EMERGENCY_FREE_GB}GB floor"
        echo "job-started-hook: dropping the entire build cache first (cheapest to rebuild)"
        docker builder prune -af >/dev/null 2>&1 || true

        avail_gb=$$(df --output=avail -BG / 2>/dev/null | tail -1 | tr -dc "0-9")
        if [ "$${avail_gb:-0}" -lt "$${EMERGENCY_FREE_GB}" ]; then
          # Only now, and loudly: this deletes the base-image cache and the
          # next run pays a full re-pull for it. If this line shows up in a
          # log, the disk needs growing -- do not treat it as normal.
          echo "job-started-hook: still only $${avail_gb}GB free -- discarding the base-image cache too; EXPECT A SLOW NEXT RUN and grow the disk"
          docker image prune -af >/dev/null 2>&1 || true
        else
          echo "job-started-hook: build cache alone recovered enough ($${avail_gb}GB free); base images kept"
        fi
      fi

      echo "job-started-hook: disk and memory at job start:"
      df -h / | tail -1
      free -h || true

  # The job-*completed* counterpart. The start hook above is the one that
  # *guarantees* a clean slate, because it runs no matter how the previous
  # job ended -- including cancelled, killed, or the runner losing its
  # connection mid-job, none of which run an end hook at all. This one is
  # not a substitute for it and does not replace any of its work.
  #
  # It exists because *when* the disk is reclaimed matters independently of
  # whether it is reclaimed. With start-only cleanup, a heavy job's images
  # and containers sit on disk for the entire gap until the next job begins
  # -- and if that job is the last of the run, they sit there through the
  # VM being deallocated and all the way into the next run, hours or days
  # later. That is exactly how run `32932666191` went from 20GB free to
  # 6.9GB and put the disk-pressure branch on a hair trigger. Freeing at
  # the end of each job means the VM is deallocated already clean, so every
  # run starts from a known state rather than inheriting the last one's
  # leftovers.
  #
  # Same prune set as the start hook, minus the emergency branch:
  # reclaiming space here is never urgent (no job is waiting on it), so
  # this only removes what is genuinely dead and bounds what genuinely
  # grows. The base-image cache is kept here unconditionally -- there is no
  # circumstance in which the right thing to do *after* a job is to throw
  # away the images the next one will immediately re-pull. The start hook
  # still makes the aggressive call, if it ever has to, at the point where
  # a job is actually about to run and space is actually short.
  - path: /opt/actions-runner/job-completed-hook.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # No `-e`: a cleanup that cannot run must never fail the job that
      # just succeeded.
      set -uo pipefail

      finished=$$(docker ps -aq 2>/dev/null || true)
      if [ -n "$${finished}" ]; then
        echo "job-completed-hook: removing $$(echo "$${finished}" | wc -l) container(s) this job left behind"
        docker rm -f $${finished} >/dev/null 2>&1 || true
      fi
      docker network prune -f >/dev/null 2>&1 || true
      # `-a` for the same reason as the start hook: without it this skips
      # every named volume, which is all of Compose's.
      docker volume prune -af >/dev/null 2>&1 || true
      docker image prune -f >/dev/null 2>&1 || true
      docker builder prune -f --max-used-space 4GB >/dev/null 2>&1 || true

      echo "job-completed-hook: disk after cleanup:"
      df -h / | tail -1
      # Named explicitly so a run that loses the model cache says so in its
      # own log rather than only showing up as an unexplained slow job.
      echo "job-completed-hook: ollama model cache: $$(du -sh /opt/ollama-models 2>/dev/null | cut -f1 || echo missing)"

packages:
  - ca-certificates
  - curl
  - jq
  # unzip/zip: absent from this minimal Ubuntu cloud image (GitHub-hosted
  # ubuntu-latest bundles them, so this gap only showed up once real jobs
  # started running here) -- unzip specifically is a hard dependency of
  # ci.yml's `hashicorp/setup-terraform@v4` step, which failed outright
  # on "Unable to locate executable file: unzip" the first time the
  # `terraform` job ran on this runner (run 32923099481).
  - unzip
  - zip

runcmd:
  # Docker Engine, official convenience script -- same install path
  # Docker's own docs recommend, not a distro-packaged docker.io build
  # that tends to lag upstream.
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker ${admin_username}
  - systemctl enable --now docker

  # Latest runner release, fetched at boot rather than pinned to a version
  # baked into this file -- this VM is long-lived (started/stopped across
  # months, not rebuilt per run, unlike a normal ephemeral CI container),
  # so a version pinned here would silently go stale. The one-time
  # registration step in README.md is the natural point to notice an
  # update is available anyway.
  - mkdir -p /opt/actions-runner

  # Registers the pre-job cleanup hook written above. `.env` is the runner's
  # own documented mechanism for environment it should read at job-dispatch
  # time, and unlike the `DOCKER_API_VERSION` attempt this file used to
  # carry (see the comment further down), this variable is read by the
  # runner process itself -- exactly what `.env` is for -- not by a library
  # deep inside a job's own process tree.
  - echo 'ACTIONS_RUNNER_HOOK_JOB_STARTED=/opt/actions-runner/job-started-hook.sh' >> /opt/actions-runner/.env
  - echo 'ACTIONS_RUNNER_HOOK_JOB_COMPLETED=/opt/actions-runner/job-completed-hook.sh' >> /opt/actions-runner/.env

  # Ollama's ~2.3GB of models (nomic-embed-text + llama3.2:3b), kept on
  # this VM's own disk instead of being round-tripped through
  # actions/cache. infra/docker-compose.yml reads OLLAMA_MODELS_DIR for
  # the host side of its bind mount and falls back to a path inside the
  # checkout when unset, which is what a GitHub-hosted ephemeral runner
  # still needs -- see that file's own comment for the two-mode split.
  #
  # Two reasons it lives at /opt and not in the workspace, both learned
  # the expensive way elsewhere in this file: actions/checkout runs
  # `git clean -ffdx`, which deletes gitignored directories inside the
  # workspace on every single job, and actions/cache on a persistent
  # runner spends ~389s per run (measured, run 32927971610) moving bytes
  # that never actually left the machine, plus NAT Gateway data-processing
  # charges on both legs of the round trip.
  #
  # 0777 rather than owned by the runner user: Ollama runs as root inside
  # its container and writes its identity key and blob cache into this
  # mount, while docker compose is invoked by the unprivileged runner
  # user. Nothing secret is stored here -- these are public model weights
  # -- and this is a single-tenant CI box with no inbound network path.
  - mkdir -p /opt/ollama-models
  - chmod 0777 /opt/ollama-models
  - echo 'OLLAMA_MODELS_DIR=/opt/ollama-models' >> /opt/actions-runner/.env

  # 4GB of swap. Not a fix for anything -- the container-cleanup hook above
  # is the actual fix -- but this box has 7.8GB and *zero* swap, against a
  # ci.yml originally written for GitHub-hosted runners with 16GB. Swap
  # turns the failure mode at the margin from a hard healthcheck timeout
  # into a slow job that still passes. 4GB against 32GB of disk (~9GB free
  # after images) leaves real headroom; grow the disk before growing this.
  - fallocate -l 4G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab

  # Testcontainers-Java (api/pom.xml's pinned testcontainers.version)
  # ships a Docker-client detection probe that hardcodes API version 1.32
  # for its initial handshake -- a known upstream testcontainers-java/
  # docker-java gap against Docker Engine releases this recent (29.7.2,
  # installed fresh via get.docker.com below, minimum supported API 1.40).
  # Fixed in the repo itself, not here: `DOCKER_API_VERSION`/`DOCKER_HOST`
  # environment variables were tried first (a `.env` file used to live at
  # this exact point in this script) and neither changed the outcome --
  # confirmed live, by testing both directly on this VM against the real
  # failing test, not assumed. Every strategy docker-java tried, including
  # `EnvironmentAndSystemPropertyClientProviderStrategy` (the one meant to
  # read exactly these env vars), failed with the identical hardcoded-1.32
  # error, which means the handshake this daemon rejects happens before
  # docker-java ever consults them. `api/src/test/resources/docker-
  # java.properties` (a classpath resource, docker-java's own documented
  # config mechanism, one level docker-java's config loader consults
  # earlier) is what actually worked when tested the same way -- see that
  # file's own comment for the fuller story. A VM-level fix would only
  # have helped this one project anyway; the classpath resource travels
  # with the code, so it works for anyone who clones this repo and runs
  # its tests locally too, not just on this specific runner.
  - |
    RUNNER_VERSION=$(curl -fsSL https://api.github.com/repos/actions/runner/releases/latest | jq -r '.tag_name' | sed 's/^v//')
    curl -fsSL -o /opt/actions-runner/runner.tar.gz \
      "https://github.com/actions/runner/releases/download/v$${RUNNER_VERSION}/actions-runner-linux-x64-$${RUNNER_VERSION}.tar.gz"
  - tar xzf /opt/actions-runner/runner.tar.gz -C /opt/actions-runner
  - /opt/actions-runner/bin/installdependencies.sh
  - chown -R ${admin_username}:${admin_username} /opt/actions-runner
