# The full Phase 1a slice: postgres + metabase (added ahead of schedule in
# Task 11, which needed a real Metabase instance to provision and verify
# provision_metabase.py against -- see that task's file list, which
# anticipates exactly this) plus api, ui, and the
# profile-gated one-shot `pipeline` service, added here in Task 12. Phase 1b
# Task 4 adds airflow-init/-webserver/-scheduler, which run the same four
# pipeline stages on their own hourly schedule instead of needing `make
# pipeline` run by hand.

# Shared by all three airflow-* services below -- environment, build, dags
# volume, and the postgres dependency are identical across them; only the
# command (and airflow-webserver/-scheduler's extra depends_on/ports/
# healthcheck) differs. Mirrors the x-airflow-common pattern Airflow's own
# official reference docker-compose.yaml uses for the same reason.
x-airflow-common: &airflow-common
  # Repo root, not ../data-platform -- Phase 4 Task 6 added a second
  # Python project (ai/, its own isolated venv, see Dockerfile) this image
  # needs to COPY from, the same reason api's own build already uses this
  # same root context (see the root .dockerignore's own header comment).
  build:
    context: ..
    dockerfile: infra/airflow/Dockerfile
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Local/demo stack, no encrypted connections stored -- same "$0, dev-mode,
    # local-first" tradeoff the Keycloak service above already documents for
    # itself (no TLS, hardcoded bootstrap admin).
    AIRFLOW__CORE__FERNET_KEY: ""
    # The DAG's own @hourly schedule can only actually fire if it starts
    # unpaused -- Airflow pauses newly-discovered DAGs by default, which
    # would otherwise silently defeat "runs on its own schedule."
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    # Lets test_airflow_dag.py authenticate with a plain username/password
    # against the REST API (the default session backend only accepts a
    # browser's own login cookie).
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    CANOPICA_OPERATIONAL_DSN: postgresql://canopica_app:canopica_app@postgres:5432/canopica_operational
    CANOPICA_SERVING_DSN: postgresql://canopica_app:canopica_app@postgres:5432/canopica_serving
    CANOPICA_METABASE_URL: http://metabase:3000
    CANOPICA_METABASE_USER: admin@canopica.local
    CANOPICA_METABASE_PASSWORD: CanopicaAdmin123!
    # Every canopica_data pipeline stage's span (Task 9) exports here -- the
    # container-network address for the `jaeger` service below, not the
    # host-published one Settings' own default points at.
    CANOPICA_OTEL_EXPORTER_ENDPOINT: http://jaeger:4318/v1/traces
    # Phase 4 Task 6's refresh_sla_stall_reasons task calls into ai/'s own
    # isolated venv, which needs the container-network address for Ollama
    # (Settings' own default is localhost, unreachable from this container)
    # -- same "hardcoded address for a same-Compose-network peer" posture
    # canopica_pipeline_dag.py's own API_BASE_URL constant already documents.
    CANOPICA_OLLAMA_BASE_URL: http://ollama:11434
  volumes:
    - ../infra/airflow/dags:/opt/airflow/dags
  depends_on:
    postgres:
      condition: service_healthy

services:
  # postgres:16-alpine -> the pgmq org's own pg18-pgmq image (Phase 3
  # design doc §2.2): pgmq needs its extension compiled in, and this is
  # the extension's own maintained image rather than a hand-rolled
  # Dockerfile layer -- same "use the maintained thing" posture this repo
  # already took with postgres:16-alpine itself. Real side effect worth
  # stating plainly: this also bumps Postgres 16 -> 18. Accepted because
  # every schema/migration/driver this repo uses (Flyway, JDBC, psycopg)
  # targets standard SQL features already compatible with 18, and this
  # database has no persistent production data to migrate -- local dev
  # volumes and CI both start fresh.
  postgres:
    image: ghcr.io/pgmq/pg18-pgmq:v1.10.0
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      # /var/lib/postgresql/data -> /var/lib/postgresql (2026-08-28, hit
      # for real): the 18+ docker-library images changed their expected
      # mount point -- data now lives in a major-version-specific
      # subdirectory the image manages itself (pg_ctlcluster-style
      # layout), and the container refuses to start if something is
      # mounted at the old .../data path instead (see
      # github.com/docker-library/postgres/pull/1259, cited verbatim in
      # this image's own startup error). Mounting the parent is the
      # documented fix, not a workaround.
      - postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Phase 3's object storage (design doc §2.1) -- pinned to MinIO's last
  # official release rather than `:latest`. Real reason, not just this
  # repo's usual pin-everything convention: MinIO's community edition was
  # archived by its own maintainers in 2026 (no new releases; the company
  # moved to a paid product, AIStor). The server code was never
  # relicensed -- still AGPLv3, still free to run -- so this changes
  # maintenance status, not cost. Accepted for this local/CI-only,
  # never-internet-facing use the same way this stack already accepts
  # no-TLS/dev-mode credentials on postgres/keycloak; see the tradeoffs
  # doc's Object storage row.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: canopica
      MINIO_ROOT_PASSWORD: canopica-minio-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # One-shot: creates the `canopica-documents` bucket (design doc §2.1).
  # Same shape as `ollama-init` below -- idempotent (`mc mb --ignore-
  # existing`), safe to re-run on every `make up`.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: /bin/sh
    command:
      - -c
      - "mc alias set local http://minio:9000 canopica canopica-minio-dev && mc mb --ignore-existing local/canopica-documents"
    depends_on:
      minio:
        condition: service_healthy

  metabase:
    image: metabase/metabase:latest
    ports:
      - "3001:3000"
    # Metabase's own app database (dashboards, cards, users) stays on its
    # bundled internal H2 store rather than external Postgres -- its content
    # is provisioned by provision_metabase.py, so losing it costs one script
    # run, not data. It only needs `postgres` reachable as a *data source*
    # (see CANOPICA_SERVING_DSN), not as its own app database.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      # Widened from the original retries: 12 (~150s budget) after a real CI
      # failure (Task 4): metabase's JVM startup missed that budget by ~12s
      # once three more containers (the new airflow-* services) were building
      # and starting concurrently on the same runner -- a resource-contention
      # near-miss caused by the stack's own added weight, not a metabase
      # regression, so the fix is headroom, not a metabase config change.
      retries: 20
      start_period: 30s

  # Dev-mode Keycloak: no TLS, a bootstrap admin whose credentials are
  # local-only -- same "$0, self-hosted, local-first" tradeoff every other
  # service in this stack already makes. See identity/README.md.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: CanopicaKeycloakAdmin123!
      # Health endpoint lives on a separate management port (9000, not
      # 8080) since Keycloak 26 and is off unless explicitly enabled.
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ../identity/realm-export:/opt/keycloak/data/import:ro
    ports:
      - "8081:8080"
    healthcheck:
      # No curl/wget in this image -- /dev/tcp is bash's own raw-socket
      # workaround, the standard fix for that gap.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    environment:
      CANOPICA_OPERATIONAL_JDBC_URL: jdbc:postgresql://postgres:5432/canopica_operational
      CANOPICA_OPERATIONAL_USER: canopica_app
      CANOPICA_OPERATIONAL_PASSWORD: canopica_app
      # Deliberately *not* overriding CANOPICA_KEYCLOAK_*_ISSUER_URI here -- every
      # token's real `iss` claim is localhost:8081 (application.yml's own
      # default), since every caller that ever requests a token (browser,
      # test, the synthetic-data loader) runs on the host, never inside this
      # network. Only jwks-uri needs the container-network address, since
      # that one's an address api actually connects to. See
      # SecurityConfig.lazyJwksDecoder's comment for the full reasoning.
      CANOPICA_KEYCLOAK_WORKERS_JWKS_URI: http://keycloak:8080/realms/canopica-workers/protocol/openid-connect/certs
      CANOPICA_KEYCLOAK_CITIZENS_JWKS_URI: http://keycloak:8080/realms/canopica-citizens/protocol/openid-connect/certs
      # Container-network address for the `jaeger` service below --
      # application.yml's own default (localhost:4318) is for local,
      # non-Docker dev only. See management.otlp.tracing.endpoint (Task 9).
      CANOPICA_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      # The rule-authoring copilot (ai/) has no Compose service of its own yet
      # -- Task 9's public hosted demo is where the AI layer actually gets
      # deployed, and standing up a half-configured one here would preempt that
      # design. Until then it runs on the host (`uvicorn
      # canopica_ai.policy_intelligence.rule_authoring.api:app --port 8000`), and
      # `host.docker.internal` is how this container reaches it. Note this is
      # the *opposite* direction from Task 2's Policy Q&A, where the caller is
      # the browser and application.yml's plain localhost default is already
      # right -- api is in a container, so localhost would be itself.
      CANOPICA_AI_RULE_AUTHORING_URL: http://host.docker.internal:8000
      # Phase 3 Task 2: container-network address for the `minio` service
      # below -- application.yml's own localhost default is for local,
      # non-Docker dev only, same split as every other service address here.
      CANOPICA_MINIO_ENDPOINT: http://minio:9000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      jaeger:
        condition: service_started
      minio:
        condition: service_healthy
      # Not just minio itself: a real upload needs the canopica-documents
      # bucket minio-init creates, or PutObject fails outright. `up -d`
      # with no service arguments (make up) starts every defined service
      # regardless, which is why this gap was invisible locally -- but a
      # narrowed `docker compose up --wait <services>` (ci.yml's e2e-ai
      # job only ever names opensearch/ollama/api) only starts what's
      # reachable from the named services' own depends_on graphs, and
      # minio-init had no dependents at all until this line. Found by
      # Phase 3 Task 3's own new e2e Python tests, which are the first
      # thing to actually exercise a real upload through this compose
      # stack -- DocumentControllerTest's Java coverage uses its own
      # self-contained Testcontainers MinIO, never this service.
      # service_completed_successfully (not service_started) is also what
      # sidesteps the docker/compose#10596 exit-code-1-on-a-clean-exit bug
      # ollama-init's own comment (below) describes -- that workaround was
      # needed only because nothing depended on ollama-init the normal way.
      minio-init:
        condition: service_completed_successfully
    # Healthcheck itself lives in api/Dockerfile (needs curl, installed
    # there) -- nothing to repeat here.

  ui:
    build:
      context: ../ui
    ports:
      - "3000:80"
    depends_on:
      - api

  # Ingestion -> dbt build -> serving materialization -> Metabase
  # provisioning, as a one-shot container: `docker compose --profile
  # pipeline run --rm pipeline` (what `make pipeline` runs). Profile-gated
  # so `make up`/`docker compose up` never starts it on its own -- it's a
  # job, not a long-running service.
  pipeline:
    build:
      context: ../data-platform
    profiles: [pipeline]
    environment:
      CANOPICA_OPERATIONAL_DSN: postgresql://canopica_app:canopica_app@postgres:5432/canopica_operational
      CANOPICA_SERVING_DSN: postgresql://canopica_app:canopica_app@postgres:5432/canopica_serving
      CANOPICA_METABASE_URL: http://metabase:3000
      CANOPICA_METABASE_USER: admin@canopica.local
      CANOPICA_METABASE_PASSWORD: CanopicaAdmin123!
      CANOPICA_OTEL_EXPORTER_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      metabase:
        condition: service_healthy

  # Phase 2's AI capability layer infrastructure: a policy-corpus search
  # engine (OpenSearch) and a local LLM/embedding runtime (Ollama) -- both
  # $0, self-hosted, local-first, same posture as every other service here.
  # OpenSearch needs the host's vm.max_map_count >= 262144 (its own
  # documented minimum) -- already satisfied by Docker Desktop's default
  # Linux VM as of this writing; if the container fails its healthcheck
  # with a "max virtual memory areas" error on another machine, raise it
  # there (`docker run --rm --privileged alpine sysctl -w
  # vm.max_map_count=262144`, or Docker Desktop's own VM settings).
  opensearch:
    image: opensearchproject/opensearch:2.19.6
    environment:
      discovery.type: single-node
      # No TLS, no auth -- same "$0, dev-mode, local-first" tradeoff
      # postgres/keycloak above already make for themselves.
      DISABLE_SECURITY_PLUGIN: "true"
      # 512m (this corpus's own indexing/query load needs far less) tripped
      # ml-commons' memory circuit breaker the moment the cross-encoder
      # reranker model tried to deploy (real failure hit during
      # implementation: "Memory Circuit Breaker is open") -- the breaker
      # checks heap-usage percentage, not absolute size, so a small capped
      # heap fills up fast once a model is loaded into it. 1200m cleared
      # that on an 8GB+ dev machine, but the same "Memory Circuit Breaker
      # is open" error hit again live in CI (2026-08-23, Phase 2 Task 2) --
      # ai/'s e2e suite now runs real Ollama generation on top of Task 1's
      # embeddings-only load, and 1200m didn't clear the same
      # percentage-of-heap threshold under that heavier, real-generation
      # session. 2g widened the same margin further, and held for months --
      # until `_CI_GATE_QUESTIONS` grew 8 -> 12 in the same commit as the
      # runner resize (2026-08-27, CI run 33037187113): `ai-eval` tripped
      # the same breaker again, this time surviving all of
      # retrieval.py's own retry budget (heap read 94% against ml-commons'
      # 92% threshold at the final attempt). A local repro of the identical
      # 12-question run against this same 2g cap did *not* reproduce it --
      # so this is the same marginal sawtooth as ever, just pushed closer
      # to the edge by more questions' worth of reranker/hybrid-search load
      # per run, not a new failure mode. 3g buys back that margin the same
      # way 1200m -> 2g did last time load grew, rather than raising
      # ml-commons' own *percentage* threshold again -- 85 -> 92 already
      # proved that doesn't fix a sawtooth, it just moves the peak.
      OPENSEARCH_JAVA_OPTS: "-Xms3g -Xmx3g"
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  ollama:
    image: ollama/ollama:0.32.15
    # `OLLAMA_MAX_LOADED_MODELS: "1"` was tried here (2026-08-23) and
    # deliberately NOT kept -- recorded because the reasoning is worth more
    # than the one-line diff. Both models sit resident together,
    # nomic-embed-text (376MB) alongside llama3.2:3b (2.9GB), and capping
    # to one evicts the embedder to free that 376MB. It does work, but the
    # first assumption behind it was wrong: embeddings are not a one-off
    # indexing cost, because hybrid_search embeds *every query* for its
    # k-NN half, so the cap makes Ollama swap models on every single
    # search. Measured cost of that thrashing on ai/'s own e2e suite:
    # 330s with the cap versus 190s without, both 15/15. And it buys
    # nothing where it would have to pay off -- the CI runner has had zero
    # `signal: killed` events since the e2e split gave the AI job its own
    # lean stack (checked across both runs). The OOM kills that motivated
    # it are specific to this project's dev Docker VM (~7.65GB, shared
    # with everything else running on the machine). If a local run starts
    # getting killed, set it in a local override rather than here: it is
    # the right trade on a memory-starved laptop and the wrong one in CI.
    environment:
      # Caps llama.cpp's prompt-reuse cache, which Ollama does not expose an
      # OLLAMA_* variable for but does pass LLAMA_ARG_* through to
      # llama-server. Found by reading Ollama's own logs during Phase 2
      # Task 3: `cache state: 3 prompts, 584.235 MiB (limits: 8192.000 MiB
      # ...)`. The default ceiling is 8GB -- more than this whole Docker VM
      # has (7.65GB) -- so on a host without GPU VRAM to spend it is a cache
      # that will happily grow until something else is killed, and this
      # suite's back-to-back similar prompts are exactly the workload that
      # grows it. 512MB keeps the reuse benefit for consecutive near-
      # identical prompts (a single cached prompt here measured ~200MB)
      # while bounding it well below what the model itself needs. Verified
      # honored, not assumed: the limit in that same log line reads
      # `512.000 MiB` with this set.
      LLAMA_ARG_CACHE_RAM: "512"
      # Quantized K/V cache, to pay back the memory that raising num_ctx from
      # the 2048 default to 4096 cost. That raise is not optional -- at 2048
      # Ollama was silently truncating this system's real prompts (see
      # canopica_ai.config.Settings.ollama_num_ctx for the measurement) -- but it
      # widened the KV cache enough to tip OpenSearch's ml-commons native
      # memory circuit breaker on the CI runner, whose threshold is a
      # percentage of *host* memory, so Ollama growing is directly what trips
      # it (run 32688091165: 9 failures, all `circuit_breaking_exception`).
      # Measured here rather than assumed: llama3.2:3b at num_ctx=4096 uses
      # 2.733GiB with the f16 default and 2.524GiB at q8_0, so this returns
      # ~209MB of the ~235MB the raise cost. Verified honored by reading
      # Ollama's own launch line for `--cache-type-k q8_0 --cache-type-v
      # q8_0`, not inferred from the variable being set. q8_0 is the
      # conservative quantization (not q4_0) and needs flash attention, set
      # below.
      OLLAMA_KV_CACHE_TYPE: "q8_0"
      OLLAMA_FLASH_ATTENTION: "1"
    ports:
      - "11434:11434"
    volumes:
      # A host bind mount, not a named volume, on purpose, and its host
      # side is overridable because the two runner types this repo now
      # targets need it to live in two different places:
      #
      # - Default (`./ollama-models`, i.e. inside the checkout): what a
      #   GitHub-hosted ephemeral runner needs. The machine is destroyed
      #   after every job, so the only way to carry the ~2.3GB
      #   nomic-embed-text + llama3.2:3b pull across runs is to hand the
      #   path to actions/cache -- and a named volume has no stable host
      #   path actions/cache could target. It also has to sit inside the
      #   workspace for actions/cache to reach it at all.
      # - `OLLAMA_MODELS_DIR=/opt/ollama-models`: what the self-hosted VM
      #   sets (in the runner's own .env, see infra/azure/ci-runner/
      #   cloud-init.yaml). That machine persists across runs, so the
      #   models simply stay on its disk and no cache upload/download is
      #   involved at all -- which is the point, because actions/cache
      #   round-trips ~2.3GB through the network on *both* ends and that
      #   is 389s of the last measured run plus NAT Gateway data charges,
      #   to move bytes that never left the box. It must be *outside* the
      #   workspace because actions/checkout runs `git clean -ffdx`, which
      #   would delete a gitignored directory inside it on every job.
      #
      # `ollama pull` is content-addressed and already idempotent either
      # way, so a warm directory just verifies existing blobs in seconds
      # instead of re-downloading them.
      - ${OLLAMA_MODELS_DIR:-./ollama-models}:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # One-shot: pulls the two pinned model tags `canopica_ai.config.Settings`
  # names (`ollama_embedding_model`/`ollama_generation_model`) into the
  # `ollama` service's own named volume. `ollama pull` is idempotent --
  # already-pulled tags are a fast no-op re-check, not a re-download -- so
  # this is safe to run on every `make up`. Unlike `airflow-init` above,
  # nothing here declares `depends_on: condition: service_completed_
  # successfully` on this service, because nothing in this compose file
  # actually needs the models present to start -- only the `ai/` test
  # suite, run outside Compose, does. That means `docker compose up --wait`
  # cannot be pointed at this service the way it can at `airflow-init`
  # (see the `e2e` job in `.github/workflows/ci.yml` for how CI waits on
  # this one instead: `compose wait`, not `up --wait`).
  ollama-init:
    image: ollama/ollama:0.32.15
    entrypoint: /bin/sh
    command:
      - -c
      - "ollama pull nomic-embed-text && ollama pull llama3.2:3b"
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  # Jaeger v2 (v1 reached EOL 2025-12-31): a single binary built on the
  # OpenTelemetry Collector, run here with its own built-in default config
  # (in-memory storage, OTLP gRPC/HTTP receivers, UI+query API on 16686) --
  # no config file needed for this stack's purposes, same "lightweight,
  # $0, docker compose up" fit as every other service here (design doc
  # §2.5). In-memory storage means traces don't survive a restart, an
  # accepted tradeoff for a local demo, not a production deployment.
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    ports:
      - "16686:16686" # UI + query API (data-platform/tests/test_observability.py hits this)
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver -- what both api and canopica_data actually export to

  prometheus:
    image: prom/prometheus:v3.13.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:12.3.0
    environment:
      # Dev-mode credential, same "$0, self-hosted, local-first" tradeoff
      # every other service's admin login in this stack already makes.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: CanopicaGrafanaAdmin123!
    volumes:
      - ./observability/grafana-provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3002:3000"
    depends_on:
      prometheus:
        condition: service_started
      # Task 8's pgmq queue-depth/archive-rate panel queries this database
      # directly (datasources.yml's own "Postgres (operational)" datasource)
      # -- healthy, not just started, so a narrowed `--wait grafana` bring-up
      # doesn't race Postgres init the way api/minio-init's own gap once did.
      postgres:
        condition: service_healthy

  # One-shot: `airflow db migrate` (idempotent, safe to re-run on every
  # boot) then create the admin user. `airflow users create` is *not*
  # idempotent -- it errors if the user already exists, which it will on
  # every `make up` after the first against the same postgres-data volume
  # -- so only that second command's failure is swallowed; a real migrate
  # failure still fails this service (and, via service_completed_
  # successfully below, blocks the webserver/scheduler from starting).
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - >-
        airflow db migrate &&
        (airflow users create --username admin --password CanopicaAirflowAdmin123!
        --firstname Admin --lastname Admin --role Admin --email admin@canopica.local
        || true)

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  # LocalExecutor runs every task as a subprocess of the scheduler itself,
  # not a separate worker -- this is the container that actually executes
  # extract/dbt_build/materialize/provision_metabase. No triggerer service:
  # that's only needed for deferrable operators, which this DAG doesn't use.
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  opensearch-data:
  minio-data:
