# The full Phase 1a slice: postgres + metabase (added ahead of schedule in
# Task 11, which needed a real Metabase instance to provision and verify
# provision_metabase.py against -- see that task's file list, which
# anticipates exactly this) plus portal-api, portal-web, and the
# profile-gated one-shot `pipeline` service, added here in Task 12.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:latest
    ports:
      - "3001:3000"
    # Metabase's own app database (dashboards, cards, users) stays on its
    # bundled internal H2 store rather than external Postgres -- its content
    # is provisioned by provision_metabase.py, so losing it costs one script
    # run, not data. It only needs `postgres` reachable as a *data source*
    # (see IES_SERVING_DSN), not as its own app database.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  portal-api:
    build:
      context: ..
      dockerfile: portal/Dockerfile
    environment:
      IES_OPERATIONAL_JDBC_URL: jdbc:postgresql://postgres:5432/ies_operational
      IES_OPERATIONAL_USER: ies_app
      IES_OPERATIONAL_PASSWORD: ies_app
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    # Healthcheck itself lives in portal/Dockerfile (needs curl, installed
    # there) -- nothing to repeat here.

  portal-web:
    build:
      context: ../portal/web
    ports:
      - "3000:80"
    depends_on:
      - portal-api

  # Ingestion -> dbt build -> serving materialization -> Metabase
  # provisioning, as a one-shot container: `docker compose --profile
  # pipeline run --rm pipeline` (what `make pipeline` runs). Profile-gated
  # so `make up`/`docker compose up` never starts it on its own -- it's a
  # job, not a long-running service.
  pipeline:
    build:
      context: ../data-platform
    profiles: [pipeline]
    environment:
      IES_OPERATIONAL_DSN: postgresql://ies_app:ies_app@postgres:5432/ies_operational
      IES_SERVING_DSN: postgresql://ies_app:ies_app@postgres:5432/ies_serving
      IES_METABASE_URL: http://metabase:3000
      IES_METABASE_USER: admin@ies.local
      IES_METABASE_PASSWORD: IesAdmin123!
    depends_on:
      postgres:
        condition: service_healthy
      metabase:
        condition: service_healthy

volumes:
  postgres-data:
