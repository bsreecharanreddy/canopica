# The full Phase 1a slice: postgres + metabase (added ahead of schedule in
# Task 11, which needed a real Metabase instance to provision and verify
# provision_metabase.py against -- see that task's file list, which
# anticipates exactly this) plus portal-api, portal-web, and the
# profile-gated one-shot `pipeline` service, added here in Task 12. Phase 1b
# Task 4 adds airflow-init/-webserver/-scheduler, which run the same four
# pipeline stages on their own hourly schedule instead of needing `make
# pipeline` run by hand.

# Shared by all three airflow-* services below -- environment, build, dags
# volume, and the postgres dependency are identical across them; only the
# command (and airflow-webserver/-scheduler's extra depends_on/ports/
# healthcheck) differs. Mirrors the x-airflow-common pattern Airflow's own
# official reference docker-compose.yaml uses for the same reason.
x-airflow-common: &airflow-common
  build:
    context: ../data-platform
    dockerfile: ../infra/airflow/Dockerfile
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Local/demo stack, no encrypted connections stored -- same "$0, dev-mode,
    # local-first" tradeoff the Keycloak service above already documents for
    # itself (no TLS, hardcoded bootstrap admin).
    AIRFLOW__CORE__FERNET_KEY: ""
    # The DAG's own @hourly schedule can only actually fire if it starts
    # unpaused -- Airflow pauses newly-discovered DAGs by default, which
    # would otherwise silently defeat "runs on its own schedule."
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    # Lets test_airflow_dag.py authenticate with a plain username/password
    # against the REST API (the default session backend only accepts a
    # browser's own login cookie).
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    CANOPICA_OPERATIONAL_DSN: postgresql://canopica_app:canopica_app@postgres:5432/canopica_operational
    CANOPICA_SERVING_DSN: postgresql://canopica_app:canopica_app@postgres:5432/canopica_serving
    CANOPICA_METABASE_URL: http://metabase:3000
    CANOPICA_METABASE_USER: admin@canopica.local
    CANOPICA_METABASE_PASSWORD: CanopicaAdmin123!
  volumes:
    - ../infra/airflow/dags:/opt/airflow/dags
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:latest
    ports:
      - "3001:3000"
    # Metabase's own app database (dashboards, cards, users) stays on its
    # bundled internal H2 store rather than external Postgres -- its content
    # is provisioned by provision_metabase.py, so losing it costs one script
    # run, not data. It only needs `postgres` reachable as a *data source*
    # (see CANOPICA_SERVING_DSN), not as its own app database.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      # Widened from the original retries: 12 (~150s budget) after a real CI
      # failure (Task 4): metabase's JVM startup missed that budget by ~12s
      # once three more containers (the new airflow-* services) were building
      # and starting concurrently on the same runner -- a resource-contention
      # near-miss caused by the stack's own added weight, not a metabase
      # regression, so the fix is headroom, not a metabase config change.
      retries: 20
      start_period: 30s

  # Dev-mode Keycloak: no TLS, a bootstrap admin whose credentials are
  # local-only -- same "$0, self-hosted, local-first" tradeoff every other
  # service in this stack already makes. See identity/README.md.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: CanopicaKeycloakAdmin123!
      # Health endpoint lives on a separate management port (9000, not
      # 8080) since Keycloak 26 and is off unless explicitly enabled.
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ../identity/realm-export:/opt/keycloak/data/import:ro
    ports:
      - "8081:8080"
    healthcheck:
      # No curl/wget in this image -- /dev/tcp is bash's own raw-socket
      # workaround, the standard fix for that gap.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  portal-api:
    build:
      context: ..
      dockerfile: portal/Dockerfile
    environment:
      CANOPICA_OPERATIONAL_JDBC_URL: jdbc:postgresql://postgres:5432/canopica_operational
      CANOPICA_OPERATIONAL_USER: canopica_app
      CANOPICA_OPERATIONAL_PASSWORD: canopica_app
      # Deliberately *not* overriding CANOPICA_KEYCLOAK_*_ISSUER_URI here -- every
      # token's real `iss` claim is localhost:8081 (application.yml's own
      # default), since every caller that ever requests a token (browser,
      # test, the synthetic-data loader) runs on the host, never inside this
      # network. Only jwks-uri needs the container-network address, since
      # that one's an address portal-api actually connects to. See
      # SecurityConfig.lazyJwksDecoder's comment for the full reasoning.
      CANOPICA_KEYCLOAK_WORKERS_JWKS_URI: http://keycloak:8080/realms/canopica-workers/protocol/openid-connect/certs
      CANOPICA_KEYCLOAK_CITIZENS_JWKS_URI: http://keycloak:8080/realms/canopica-citizens/protocol/openid-connect/certs
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    # Healthcheck itself lives in portal/Dockerfile (needs curl, installed
    # there) -- nothing to repeat here.

  portal-web:
    build:
      context: ../portal/web
    ports:
      - "3000:80"
    depends_on:
      - portal-api

  # Ingestion -> dbt build -> serving materialization -> Metabase
  # provisioning, as a one-shot container: `docker compose --profile
  # pipeline run --rm pipeline` (what `make pipeline` runs). Profile-gated
  # so `make up`/`docker compose up` never starts it on its own -- it's a
  # job, not a long-running service.
  pipeline:
    build:
      context: ../data-platform
    profiles: [pipeline]
    environment:
      CANOPICA_OPERATIONAL_DSN: postgresql://canopica_app:canopica_app@postgres:5432/canopica_operational
      CANOPICA_SERVING_DSN: postgresql://canopica_app:canopica_app@postgres:5432/canopica_serving
      CANOPICA_METABASE_URL: http://metabase:3000
      CANOPICA_METABASE_USER: admin@canopica.local
      CANOPICA_METABASE_PASSWORD: CanopicaAdmin123!
    depends_on:
      postgres:
        condition: service_healthy
      metabase:
        condition: service_healthy

  # One-shot: `airflow db migrate` (idempotent, safe to re-run on every
  # boot) then create the admin user. `airflow users create` is *not*
  # idempotent -- it errors if the user already exists, which it will on
  # every `make up` after the first against the same postgres-data volume
  # -- so only that second command's failure is swallowed; a real migrate
  # failure still fails this service (and, via service_completed_
  # successfully below, blocks the webserver/scheduler from starting).
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - >-
        airflow db migrate &&
        (airflow users create --username admin --password CanopicaAirflowAdmin123!
        --firstname Admin --lastname Admin --role Admin --email admin@canopica.local
        || true)

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  # LocalExecutor runs every task as a subprocess of the scheduler itself,
  # not a separate worker -- this is the container that actually executes
  # extract/dbt_build/materialize/provision_metabase. No triggerer service:
  # that's only needed for deferrable operators, which this DAG doesn't use.
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
