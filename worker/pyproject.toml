[project]
name = "canopica-worker"
version = "0.1.0"
description = "Canopica async worker: pgmq consumer for document intake and correspondence dispatch (Phase 3)"
readme = "README.md"
authors = [
    { name = "Sree", email = "283869510+bsreecharanreddy@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    # Task 3's document_intake_consumer calls
    # canopica_ai.document_intake.service.classify_and_extract directly
    # (Task 3 plan's own Interfaces note: "the sole interface the worker
    # consumer calls") -- the first time any package in this monorepo
    # imports another's Python code in-process rather than via subprocess/
    # file/network (ai/ <-> data-platform is a sibling-artifact path
    # dependency, never a Python import). A path dependency rather than a
    # published package, matching this being one monorepo with no package
    # registry of its own.
    "canopica-ai",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "opentelemetry-exporter-otlp>=1.39.0",
    "opentelemetry-sdk>=1.39.0",
]

[tool.uv.sources]
canopica-ai = { path = "../ai", editable = true }

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "testcontainers>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PL", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs a running Postgres (Docker)",
]
