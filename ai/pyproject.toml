[project]
name = "canopica-ai"
version = "0.1.0"
description = "Canopica AI capability layer: Policy Intelligence & Analytics AI (Phase 2)"
readme = "README.md"
authors = [
    { name = "Sree", email = "283869510+bsreecharanreddy@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    # Document Intake (Phase 3 Task 3): the same S3-compatible client the
    # API's own MinioConfig.java uses AWS SDK v2 for, Python's equivalent.
    "boto3>=1.42.0",
    "deepeval>=3.0.0",
    "defusedxml>=0.7.1",
    # Pinned to the same version data-platform's own dbt-duckdb pulls in
    # (checked live: 1.5.5) -- this service opens the identical .duckdb
    # file dbt wrote, and DuckDB's storage format is not guaranteed
    # cross-version compatible.
    "duckdb>=1.5.5",
    "fastapi>=0.121.2",
    "httpx>=0.28.1",
    "mcp>=1.19.0",
    "opensearch-py>=3.0.0",
    "opentelemetry-exporter-otlp>=1.39.0",
    "opentelemetry-sdk>=1.39.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.10.1",
    # Document Intake's PDF text-extraction path (classify.py's own doc
    # comment on why this isn't OCR).
    "pypdf>=6.4.0",
    # Document Intake's OCR fallback for image-only uploads -- the Python
    # wrapper for the Tesseract OCR engine; needs the `tesseract-ocr`
    # system package installed separately (Homebrew/apt), same as
    # `data-platform`'s own dbt needing a real Postgres client library.
    "pytesseract>=0.3.13",
    "pillow>=12.0.0",
    "pyyaml>=6.0.2",
    # Only ever undeclared-transitive before Task 9 Step 4/5 -- uv.lock
    # already resolved it (some other dependency needs it), but the
    # public demo's own server entry point (`uvicorn canopica_ai.
    # public_demo.app:app`) is a real, direct use now, not a coincidence
    # of what else happens to be installed.
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.42.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    # Already present as deepeval's own transitive dependency; declared
    # directly now that a real test (TestAskWithARealModel) depends on its
    # `@pytest.mark.flaky` behavior deliberately, not by accident.
    "pytest-rerunfailures>=16.6",
    "ruff>=0.16.4",
    "types-defusedxml>=0.7.0",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PL", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Magic-number comparisons against expected fixture values are normal and
# readable in test assertions; naming every one as a constant hurts more
# than it helps.
"tests/**/*.py" = ["PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"

[[tool.mypy.overrides]]
# No type stubs published for pytesseract (checked live: no
# types-pytesseract package on PyPI) -- its own surface used here is one
# function with a plain str/Image argument and str return, low enough risk
# to accept untyped rather than hand-write and maintain a local stub for.
module = "pytesseract"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "e2e: needs the full Compose stack (OpenSearch + Ollama, real models pulled)",
]
