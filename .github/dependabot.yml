# Automated dependency-update PRs, one per ecosystem this repo actually
# uses -- see CLAUDE.md's "Language policy" and "Tech stack" for why each
# of these exists (Java API + rules engine, the data platform's uv-managed
# Python, the React UI's npm client, three Dockerfiles from Task 12, and
# this repo's own CI workflow).
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: weekly

  - package-ecosystem: uv
    directory: "/data-platform"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/api"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/ui"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/data-platform"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
