name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  java:
    name: Java (portal + rules engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Testcontainers tests (Task 2 onward) use the runner's own Docker daemon.
      - run: ./mvnw -B verify

  web:
    name: Web (React portal)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portal/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  python:
    name: Python (data platform)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-platform
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest -m "not e2e and not integration"

  ai:
    name: Python (AI capability layer)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest -m "not e2e"

  audit-chain:
    name: Audit chain verifier (integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-platform
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run pytest -m integration tests/test_verify_chain.py

  dbt:
    name: Bronze ingestion + dbt silver/gold (integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-platform
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run pytest -m integration tests/test_extract.py tests/test_dbt_build.py tests/test_mart_processing_timeliness.py tests/test_tokenize.py

  reporting:
    name: Serving-layer materialization (integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-platform
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run pytest -m integration tests/test_materialize.py

  e2e:
    name: End-to-end (full Compose stack)
    runs-on: ubuntu-latest
    needs: [java, python, ai, dbt]
    steps:
      - uses: actions/checkout@v7
      # The full stack (14 services, now including OpenSearch + Ollama +
      # the two models ollama-init pulls at runtime) doesn't fit in the
      # runner's default free disk alongside its preinstalled toolchains.
      # None of these toolchains are used anywhere in this repo, so it's
      # safe to reclaim their space rather than move to a bigger runner.
      - name: Free disk space for the Compose stack
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: docker compose -f infra/docker-compose.yml up -d --build --wait
      - run: cd data-platform && uv sync --dev && uv run pytest -m e2e
      # Provisions its own corpus index + search pipeline against the
      # OpenSearch/Ollama services above (conftest.py's indexed_corpus
      # fixture) -- no separate setup step needed here.
      - run: cd ai && uv sync --dev && uv run pytest -m e2e
      - if: always()
        run: docker compose -f infra/docker-compose.yml logs --no-color > compose-logs.txt
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs
          path: compose-logs.txt

  terraform:
    name: Reference Terraform for Azure (validate only)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/azure
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.15.8'
      - run: terraform fmt -check
      - run: terraform init -backend=false
      # No plan/apply -- infra/azure/README.md states why (no subscription,
      # no state backend, reference-only). validate catches type/reference
      # errors without needing either.
      - run: terraform validate
