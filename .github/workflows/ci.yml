name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  java:
    name: Java (portal + rules engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Testcontainers tests (Task 2 onward) use the runner's own Docker daemon.
      - run: ./mvnw -B verify

  web:
    name: Web (React portal)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portal/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  python:
    name: Python (data platform)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-platform
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest -m "not e2e and not integration"

  ai:
    name: Python (AI capability layer)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest -m "not e2e"

  audit-chain:
    name: Audit chain verifier (integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-platform
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run pytest -m integration tests/test_verify_chain.py

  dbt:
    name: Bronze ingestion + dbt silver/gold (integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-platform
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run pytest -m integration tests/test_extract.py tests/test_dbt_build.py tests/test_mart_processing_timeliness.py tests/test_tokenize.py

  reporting:
    name: Serving-layer materialization (integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-platform
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run pytest -m integration tests/test_materialize.py

  e2e:
    name: End-to-end (full Compose stack)
    runs-on: ubuntu-latest
    needs: [java, python, ai, dbt]
    steps:
      - uses: actions/checkout@v7
      # ollama-init (below) pulls ~2.3GB (nomic-embed-text + llama3.2:3b)
      # from Ollama's registry on every single run otherwise -- real
      # concern raised 2026-08-23 once this task's own repeated CI
      # attempts made that obvious. infra/docker-compose.yml's `ollama`
      # service bind-mounts this exact path (not a named volume, which has
      # no stable host path across separate runs) so it can be cached
      # here. `ollama pull` is content-addressed and already idempotent --
      # a warm cache just verifies existing blobs in seconds. Key is a
      # static string, not a hash of the compose file, since that file
      # changes for unrelated reasons (memory tuning, service config) far
      # more often than the pulled model tags do; bump the suffix if
      # ollama-init's own pull list ever changes.
      - uses: actions/cache@v6
        with:
          path: infra/ollama-models
          key: ollama-models-nomic-embed-text-llama3.2-3b-v1
      # The full stack (14 services, now including OpenSearch + Ollama +
      # the two models ollama-init pulls at runtime) doesn't fit in the
      # runner's default free disk alongside its preinstalled toolchains.
      # None of these toolchains are used anywhere in this repo, so it's
      # safe to reclaim their space rather than move to a bigger runner.
      - name: Free disk space for the Compose stack
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # `ollama-init` is a one-shot job (see infra/docker-compose.yml) that
      # nothing else depends on, unlike `airflow-init` -- `up --wait` treats
      # any container that exits during its convergence check as a failure
      # unless another service vouches for that exit via `depends_on:
      # condition: service_completed_successfully` (docker/compose#10596,
      # reproduced live in this project's own CI: exit code 0, but
      # `up --wait` still returned 1). Fix is Compose's own documented
      # pattern: exclude it from the health-waited bring-up, start it
      # separately, then block on its own exit code with `compose wait`.
      - run: |
          services=$(docker compose -f infra/docker-compose.yml config --services | grep -v '^ollama-init$')
          docker compose -f infra/docker-compose.yml up -d --build --wait $services
          docker compose -f infra/docker-compose.yml up -d ollama-init
          docker compose -f infra/docker-compose.yml wait ollama-init
      - run: free -h
      - run: cd data-platform && uv sync --dev && uv run pytest -m e2e
      # Real failure hit live on this runner (2026-08-23), three times, not
      # deterministically: ai/'s e2e suite re-indexes the corpus and makes
      # real Ollama generation calls (Task 2's Policy Q&A, unlike Task 1's
      # embeddings-only load), and OpenSearch's ml-commons tripped "Memory
      # Circuit Breaker is open" under the combined pressure. Stopping
      # Metabase/Grafana/Prometheus/Airflow/Jaeger/portal-web (unneeded by
      # anything ai/'s e2e suite checks) and doubling OpenSearch's heap
      # (1200m -> 2g) each helped -- the third attempt got to test 13 of 15
      # before tripping, versus roughly half before -- but still failed.
      # `docker stats` at that third failure showed Ollama itself at
      # 3.18GiB (its 3b generation model, bigger than OpenSearch's own
      # 2.4GiB heap+overhead), and `free -h` showed available memory
      # collapse from 4.8Gi right after the stop below to 569Mi by the time
      # ai/'s suite finished -- consumed *during* ai/'s own run, not
      # carried in from data-platform's. The real gap: OpenSearch and
      # Ollama had been running continuously since before data-platform's
      # e2e even started, so ai/'s suite never got the clean JVM/model-
      # cache state it gets locally, where this exact suite passes
      # reliably against a freshly-started stack on a Docker Desktop VM
      # with an almost identical ~7.65GB ceiling to this runner's ~7.8GB.
      # Recreating both containers reproduces that same clean-start
      # condition -- data survives in their named volumes, and the corpus
      # re-indexes itself idempotently via conftest.py's own fixture --
      # instead of guessing at a third heap number.
      - run: docker compose -f infra/docker-compose.yml stop metabase grafana prometheus airflow-webserver airflow-scheduler jaeger portal-web
      - run: docker compose -f infra/docker-compose.yml up -d --force-recreate --wait opensearch ollama
      - run: free -h
      # Provisions its own corpus index + search pipeline against the
      # OpenSearch/Ollama services above (conftest.py's indexed_corpus
      # fixture) -- no separate setup step needed here.
      - run: cd ai && uv sync --dev && uv run pytest -m e2e
      # Ollama (running as root in its container) writes its own identity
      # key and an internal cache file into this bind mount at 0600 --
      # real failure hit live (2026-08-23): actions/cache's own save step
      # runs as the unprivileged `runner` user and can't read root-owned
      # 0600 files, so it silently warned "Permission denied" and skipped
      # saving -- the job still went green (a cache-save failure doesn't
      # fail the job), but the cache was never actually populated, quietly
      # defeating the whole point of caching it. `if: always()` so a
      # failed test run still leaves a saveable cache behind.
      - if: always()
        run: sudo chmod -R a+rX infra/ollama-models
      - if: always()
        run: free -h && docker stats --no-stream
      - if: always()
        run: docker compose -f infra/docker-compose.yml logs --no-color > compose-logs.txt
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs
          path: compose-logs.txt

  terraform:
    name: Reference Terraform for Azure (validate only)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/azure
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.15.8'
      - run: terraform fmt -check
      - run: terraform init -backend=false
      # No plan/apply -- infra/azure/README.md states why (no subscription,
      # no state backend, reference-only). validate catches type/reference
      # errors without needing either.
      - run: terraform validate
