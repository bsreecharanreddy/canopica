name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  java:
    name: Java (portal + rules engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Testcontainers tests (Task 2 onward) use the runner's own Docker daemon.
      - run: ./mvnw -B verify

  web:
    name: Web (React portal)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portal/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  python:
    name: Python (data platform)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-platform
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest -m "not e2e"
