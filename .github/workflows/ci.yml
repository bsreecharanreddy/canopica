name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pushing a follow-up commit supersedes the run already in flight -- without
# this, a quick series of commits queues several full ~20min e2e runs whose
# results nobody will read anyway, delaying the one that matters and burning
# this private repo's finite Actions minutes.
#
# But *not on main*, and that exception is the whole point of this setting.
# On a PR branch only the latest commit's verdict matters, so superseding is
# free. On main, every commit is a permanent part of history and STATUS.md
# records a per-commit result, so a cancelled run means a commit that is
# merged and unverified -- and cancellation is not free either way, because
# whichever run gets killed has usually already paid the expensive part.
#
# This has now happened twice, both times self-inflicted by a docs-only
# push landing while a real run was mid-flight (runs 32806255794 and
# 32811724784, each killing a run that was minutes from a verdict on a real
# fix). The first was mistakenly treated as fixed by adding `.claude/` to
# the docs filter below -- that stops a docs commit from *running* the
# expensive jobs, but this block is evaluated at workflow level before any
# of that, so the previous run was still cancelled. Filtering the jobs was
# never going to fix a cancellation that happens above the jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# --- Where CI runs: two repository variables, and nothing else ----------
#
# Every job's `runs-on` reads one of two repo variables, and the whole
# GitHub-hosted <-> self-hosted-Azure-VM flip is done by setting or
# clearing them in repo settings. No workflow edit, no branch, no redeploy.
#
#   CI_LIGHT_RUNNER  -- the 8 cheap jobs (java, web, python, ai,
#                       audit-chain, dbt, reporting, terraform)
#   CI_HEAVY_RUNNER  -- the 3 expensive ones (e2e-data-platform, e2e-ai,
#                       ai-eval), the only jobs that actually need the
#                       big Compose stacks
#
# Each holds a JSON runner spec -- `["self-hosted","canopica-heavy"]` for
# the Azure VM -- and **unset means `ubuntu-latest`**. That default
# direction is deliberate: the fallback is the path that costs nothing to
# keep working and needs no infrastructure to exist. If the Azure
# subscription lapses, the VM is destroyed, or the free-trial credits run
# out, clearing two variables (or simply never setting them) is a complete
# and sufficient migration back -- rather than CI being broken until
# someone edits eleven `runs-on:` lines under time pressure.
#
# The split into two variables is what makes the intended end state
# expressible at all. Three configurations matter:
#
#   both set          -- today: one VM, everything serialized on it, near
#                        zero GitHub Actions minutes on a private repo
#   light unset,      -- the planned Sep-2026 shape: the 8 cheap jobs go
#   heavy set            back to GitHub-hosted *parallel* runners (they
#                        cost little and serializing them on one box is
#                        pure wall-clock loss), while the 3 heavy jobs
#                        stay on the VM where the minutes are expensive
#   both unset        -- fully back on GitHub Actions, the pre-2026-08-25
#                        arrangement, byte-for-byte
#
# start-runner/stop-runner gate their *steps* on the variables below
# rather than gating the jobs themselves. That is not a style choice: the
# twelve jobs all carry `needs: [start-runner]`, and a skipped job makes
# its dependents skip too, so gating the job would silently disable the
# entire workflow the moment the variables were cleared. Gating the steps
# turns those two jobs into ~3-second no-ops instead, and every `needs:`
# edge stays exactly as it is.
env:
  CI_USES_SELF_HOSTED: ${{ contains(vars.CI_LIGHT_RUNNER, 'self-hosted') || contains(vars.CI_HEAVY_RUNNER, 'self-hosted') }}

jobs:
  # This repo's own convention commits docs/STATUS.md constantly (often as
  # its own commit, e.g. recording a CI result), and each of those was
  # triggering the full end-to-end Compose stack -- ~20min to prove that
  # unchanged code still behaves unchanged. The eight fast jobs below all
  # still run on a docs-only commit (this project's standard is to verify
  # even a docs-only change) -- "fast" now means "cheap to run," not "quick
  # wall-clock": since 2026-08-25 they run on the same single self-hosted
  # VM as everything else (see `start-runner`'s own comment) and so
  # serialize with each other and the heavy jobs rather than running in
  # GitHub-hosted parallel, unlike before. Only the two expensive e2e jobs
  # are gated on real code having changed.
  #
  # Deliberately a deny-list, not an allow-list of code paths: a new
  # top-level directory nobody remembered to add here still counts as code
  # and still runs e2e. The failure mode is a wasted run, not a silently
  # skipped one.
  changes:
    name: Detect whether any code changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      ai_eval: ${{ steps.filter.outputs.ai_eval }}
      e2e_ai: ${{ steps.filter.outputs.e2e_ai }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          else
            before="${{ github.event.before }}"
            if [ -n "$before" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
              changed=$(git diff --name-only "$before" HEAD)
            else
              # First push to a branch, or a force-push that orphaned the
              # old tip: no reliable diff base, so fall back to running.
              changed=""
            fi
          fi
          echo "Changed files:"
          echo "$changed"
          # Empty (unknown diff base) deliberately falls through to `true`.
          # `.claude/` is in the docs side of this list because it holds only
          # local developer tooling -- skills (markdown) and a commit-time
          # hook CI never executes -- so nothing under it can change a job's
          # result. It is listed explicitly because the `[^/]*\.md$` branch
          # only ever matches *top-level* markdown: a nested file like
          # `.claude/skills/canopica-task-checkpoint/SKILL.md` matched neither
          # branch and so counted as code, which really happened (run
          # 32808001972) -- a pure-docs commit queued the full ~20min e2e
          # suite and, via `cancel-in-progress` above, killed the run that
          # was mid-way through proving the previous commit green.
          if [ -z "$changed" ] || echo "$changed" | grep -qvE '^(docs/|\.claude/|[^/]*\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          # `ai_eval` gates only `ai-eval` (below), the single most expensive
          # job in this workflow -- measured over a 24h window (2026-08-25)
          # at 172.6 of this workflow's 703 total Actions-minutes in that
          # window, ~25% from one job, on a private repo with a 2000
          # min/month cap. Its real dependency set is narrow and directly
          # verified from its own steps: it starts only opensearch+ollama
          # (never api, so never Keycloak, so a Java/DMN/identity-
          # realm change can't affect it) and runs only `ai/`'s own corpus-
          # index/search-pipeline/run_eval modules -- unlike `e2e-ai` below,
          # it never touches data-platform's mf/dbt binaries or a live
          # api determination. So the deny-list here is deliberately
          # wider than `code`'s: every top-level directory this job's steps
          # provably never read from.
          #
          # `e2e-ai` and `e2e-data-platform` stay on the broader `code` flag,
          # unchanged: both start api, whose own Docker build pulls
          # in `rules-engine/` via the root Maven reactor and `identity/`'s
          # realm export via Keycloak's bind mount (both confirmed by
          # reading docker-compose.yml and pom.xml, not assumed), so their
          # real dependency set is close to everything and narrowing it
          # safely would need each of those edges re-verified too.
          #
          # Same empty-fallback and fail-open philosophy as `code` above: an
          # unrecognized path counts as relevant, so the failure mode stays
          # "ran a job that didn't need to," never "silently skipped one
          # that did."
          if [ -z "$changed" ] || echo "$changed" | grep -qvE '^(docs/|\.claude/|[^/]*\.md$|reporting/|infra/azure/|api/|ui/|rules-engine/|identity/|data-platform/)'; then
            echo "ai_eval=true" >> "$GITHUB_OUTPUT"
          else
            echo "ai_eval=false" >> "$GITHUB_OUTPUT"
          fi
          # `e2e_ai` gates only `e2e-ai` (below). Narrower than `code`, but
          # deliberately *not* as narrow as `ai_eval` above -- checked
          # against what `e2e-ai`'s own steps actually start (opensearch,
          # ollama, api; never metabase/grafana/prometheus/airflow, never
          # ui, never Terraform), so `reporting/`, `infra/azure/`, and `ui/`
          # are safe to exclude on that same basis -- `ui/` because
          # `TestAnswerDenial` calls `answer_denial()` directly over HTTP
          # against the API, never through the React app this job doesn't
          # even start.
          #
          # `api/`, `rules-engine/`, and `identity/` stay IN scope here,
          # unlike `ai_eval`, for a reason specific to this job rather than
          # copied from it: `ai/tests/test_policy_qa.py::TestAnswerDenial`
          # is the *only* place in this whole suite that authenticates
          # against the citizen Keycloak realm and drives a citizen-facing
          # application through to a determination -- verified by reading
          # `data-platform/tests/test_end_to_end.py`, whose own real e2e
          # coverage of intake+determination only ever fetches a *worker*
          # token (`_fetch_worker_token`), never a citizen one. So a
          # citizen-realm-scoped regression in `identity/` or a
          # citizen-path-scoped one in `api/` would be caught nowhere
          # else if this job stopped running on those paths. `rules-engine/`
          # stays in for the same fail-open reason `ai_eval`'s own comment
          # gives: not proven disconnected, so it counts as relevant.
          # `data-platform/` also stays in -- the Analytics Copilot shells
          # out to its `mf`/`dbt` binaries in this same job.
          if [ -z "$changed" ] || echo "$changed" | grep -qvE '^(docs/|\.claude/|[^/]*\.md$|reporting/|infra/azure/|ui/)'; then
            echo "e2e_ai=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e_ai=false" >> "$GITHUB_OUTPUT"
          fi

  # Every job below except `changes`, this one, and `stop-runner` runs on
  # infra/azure/ci-runner/'s self-hosted VM, not ubuntu-latest -- see
  # docs/design/2026-08-25-self-hosted-ci-runners.md for why (2026-08-25
  # addendum: widened from the original 3 heavy jobs to all of them, after
  # this repo's GitHub Actions minutes were fully exhausted for real,
  # blocking every ubuntu-latest job outright -- run `32913936148`, "recent
  # account payments have failed or your spending limit needs to be
  # increased"). `changes`/`start-runner`/`stop-runner` are the
  # structurally-irreducible remainder: something has to decide whether to
  # turn the VM on and then actually do it, and that can't run *on* the VM
  # it's turning on. Unconditional now, unlike the narrower version this
  # replaced -- every job downstream needs the runner on every push, not
  # just when `code` changed, since the "fast" jobs below run unconditionally
  # too (see the `changes` job's own comment). No `needs: [changes]` either:
  # nothing here depends on `changes`' output anymore, so starting the VM
  # runs in parallel with change-detection instead of waiting on it.
  #
  # One thing that is NOT visible in this file, and matters when reading any
  # job below that runs `docker compose up`: because that VM is long-lived,
  # containers would otherwise survive from one job into the next and
  # accumulate until the box ran out of memory (run `32927971610` -- see
  # STATUS.md). Every job on `canopica-heavy` is therefore preceded by a
  # container-cleanup hook the runner itself invokes, defined in
  # `infra/azure/ci-runner/cloud-init.yaml`. No job here declares it; it
  # applies to all of them, including any added later.
  start-runner:
    name: Start self-hosted CI runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
    steps:
      # Both steps gated, not the job -- see the CI_*_RUNNER note at the
      # top of this file for why the job itself must keep running even when
      # no self-hosted runner is in use.
      - if: env.CI_USES_SELF_HOSTED == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - if: env.CI_USES_SELF_HOSTED == 'true'
        run: az vm start --resource-group canopica-ci-runner-rg --name canopica-ci-runner-vm

  java:
    name: Java (api + rules engine)
    runs-on: ${{ fromJSON(vars.CI_LIGHT_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    needs: [start-runner]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Testcontainers tests (Task 2 onward) use the runner's own Docker daemon.
      - run: ./mvnw -B verify

  web:
    name: Web (React UI)
    runs-on: ${{ fromJSON(vars.CI_LIGHT_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    needs: [start-runner]
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # test:coverage over plain test: same suite, plus a printed coverage
      # summary (visibility only, no threshold gate) via @vitest/coverage-v8.
      - run: npm run test:coverage

  python:
    name: Python (data platform)
    runs-on: ${{ fromJSON(vars.CI_LIGHT_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    needs: [start-runner]
    defaults:
      run:
        working-directory: data-platform
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest -m "not e2e and not integration" --cov=canopica_data --cov-report=term

  ai:
    name: Python (AI capability layer)
    runs-on: ${{ fromJSON(vars.CI_LIGHT_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    needs: [start-runner]
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v7
      # Document Intake's (Phase 3 Task 3) OCR fallback needs the real
      # Tesseract binary, not just pytesseract's Python wrapper -- neither
      # GitHub-hosted ubuntu-latest nor this repo's own minimal self-hosted
      # Azure image (infra/azure/ci-runner/cloud-init.yaml's own packages
      # list, itself added because that image turned out to lack tools
      # ubuntu-latest bundles) ship it, so it's installed explicitly here
      # rather than assumed present on whichever runner flavor is active.
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      # The Analytics Copilot (Task 5) shells out to data-platform's own
      # already-built `mf`/`dbt` binaries rather than re-vendoring
      # dbt-metricflow's dependency stack a second time (config.py's own
      # comment on `mf_binary_path`) -- a real cross-project coupling, so
      # this job needs that project's venv to exist too, not just its own.
      - run: uv sync --dev
        working-directory: data-platform
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest -m "not e2e" --cov=canopica_ai --cov-report=term

  worker:
    name: Python (async worker)
    runs-on: ${{ fromJSON(vars.CI_LIGHT_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    needs: [start-runner]
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run mypy src tests
      # CANOPICA_OTEL_ENABLED=false: this job never starts Jaeger, but Task
      # 8's queue-cycle spans (canopica_worker.observability) now wrap every
      # poll_once cycle test_main.py/test_queue.py exercise for real -- same
      # fix, same reasoning, as ai-eval's own (see that job's own comment):
      # a real no-op tracer avoids every span blocking several seconds on a
      # doomed OTLP export retry.
      - run: uv run pytest --cov=canopica_worker --cov-report=term
        env:
          CANOPICA_OTEL_ENABLED: "false"

  audit-chain:
    name: Audit chain verifier (integration)
    runs-on: ${{ fromJSON(vars.CI_LIGHT_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    needs: [start-runner]
    defaults:
      run:
        working-directory: data-platform
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run pytest -m integration tests/test_verify_chain.py

  dbt:
    name: Bronze ingestion + dbt silver/gold (integration)
    runs-on: ${{ fromJSON(vars.CI_LIGHT_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    needs: [start-runner]
    defaults:
      run:
        working-directory: data-platform
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run pytest -m integration tests/test_extract.py tests/test_dbt_build.py tests/test_mart_processing_timeliness.py tests/test_tokenize.py tests/test_fairness_gate.py tests/test_elementary.py tests/test_metric_semantics.py

  reporting:
    name: Serving-layer materialization (integration)
    runs-on: ${{ fromJSON(vars.CI_LIGHT_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    needs: [start-runner]
    defaults:
      run:
        working-directory: data-platform
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run pytest -m integration tests/test_materialize.py

  # Split from one serial job into two parallel ones (2026-08-23). The
  # combined job spent ~21min: it stood up all 14 services, ran
  # data-platform's e2e, then STOPPED seven of them and ran ai/'s e2e --
  # each suite waiting on services the other one needs and it never
  # touches. Verified from the suites' own port usage: data-platform's e2e
  # hits api/ui/metabase/keycloak/airflow/jaeger and never
  # OpenSearch or Ollama; ai/'s hits OpenSearch/Ollama/api and never
  # Metabase/Airflow/Grafana/ui. Running them side by side on lean
  # stacks makes wall-clock max(a, b) instead of a + b, and drops the two
  # heaviest services (OpenSearch's 2g heap, Ollama's ~3GB model) out of
  # the data-platform job entirely -- which also removes, structurally,
  # the memory contention behind this task's own three-times-recurring
  # "Memory Circuit Breaker is open" failures, rather than continuing to
  # tune margins around it.
  e2e-data-platform:
    name: End-to-end -- data platform
    runs-on: ${{ fromJSON(vars.CI_HEAVY_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 25
    needs: [changes, java, python, dbt, start-runner]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      # Deleting preinstalled toolchains this repo uses nowhere (disk-bound,
      # and needed because the Compose images don't fit alongside them) and
      # pulling this job's images (network-bound) are independent, so they
      # run concurrently rather than back to back -- see the same step in
      # `e2e-ai` below for the measurements behind it.
      - name: Free disk space and pull images concurrently
        run: |
          # Deleting preinstalled toolchains is GitHub-hosted only: none of
          # these paths exist on the Azure VM, where disk is instead managed
          # by the runner's own pre-job prune hook. Branched inside the step
          # rather than split into a separate gated step, so the deletion
          # still overlaps the pull on GitHub-hosted runners -- which is the
          # whole reason this step has the shape it does.
          {
            if [ "$RUNNER_ENVIRONMENT" = "github-hosted" ]; then
              sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
                          /usr/share/dotnet /opt/ghc
            fi
          } &
          cleanup=$!
          docker compose -f infra/docker-compose.yml pull --quiet \
            postgres metabase keycloak jaeger prometheus grafana &
          pull=$!
          wait "$cleanup"
          wait "$pull"
          df -h /
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # postgres/keycloak/jaeger/airflow-init come along via depends_on.
      # No `ollama-init` here, so none of the docker/compose#10596
      # one-shot-service handling the ai job below still needs.
      - run: docker compose -f infra/docker-compose.yml up -d --build --wait api ui metabase prometheus grafana airflow-webserver airflow-scheduler
      - run: cd data-platform && uv sync --dev && uv run pytest -m e2e
      - if: always()
        run: docker compose -f infra/docker-compose.yml logs --no-color > compose-logs-data-platform.txt
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs-data-platform
          path: compose-logs-data-platform.txt

  e2e-ai:
    name: End-to-end -- AI layer
    runs-on: ${{ fromJSON(vars.CI_HEAVY_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    needs: [changes, java, ai, start-runner]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.e2e_ai == 'true'
    steps:
      - uses: actions/checkout@v7
      # ollama-init pulls ~2.3GB (nomic-embed-text + llama3.2:3b) from
      # Ollama's registry on every run otherwise. infra/docker-compose.yml
      # bind-mounts this exact path (not a named volume, which has no
      # stable host path across separate runs) so it can be cached here.
      # `ollama pull` is content-addressed and idempotent -- a warm cache
      # just verifies existing blobs in seconds. Static key, not a hash of
      # the compose file: that file changes for unrelated reasons far more
      # often than the pulled model tags do. Bump the suffix if
      # ollama-init's own pull list ever changes.
      # GitHub-hosted only. On a persistent runner this step is not just
      # unnecessary but actively expensive: it moved ~2.3GB through the
      # network on both legs to restore and re-save files that never left
      # the machine, costing 389s of the 2687s total in run 32927971610
      # (14%) plus NAT Gateway data-processing charges in both directions.
      # The VM keeps the same models at /opt/ollama-models instead, via
      # OLLAMA_MODELS_DIR -- see infra/azure/ci-runner/cloud-init.yaml.
      - if: runner.environment == 'github-hosted'
        uses: actions/cache@v6
        with:
          path: infra/ollama-models
          key: ollama-models-nomic-embed-text-llama3.2-3b-v1
      # Two independent costs that used to run back to back, measured on the
      # last green run: deleting ~17GB of preinstalled toolchains this repo
      # uses nowhere (83s, disk-bound, and needed because the Compose images
      # don't fit alongside them) and pulling this job's ~10GB of images
      # (91s, network-bound). Serially that's 174s of the ~350s this job
      # spends before its first test runs; concurrently it's max(83, 91).
      # Largest directory first so the headroom the pull needs is freed
      # early rather than at the end.
      - name: Free disk space and pull images concurrently
        run: |
          # Deleting preinstalled toolchains is GitHub-hosted only: none of
          # these paths exist on the Azure VM, where disk is instead managed
          # by the runner's own pre-job prune hook. Branched inside the step
          # rather than split into a separate gated step, so the deletion
          # still overlaps the pull on GitHub-hosted runners -- which is the
          # whole reason this step has the shape it does.
          {
            if [ "$RUNNER_ENVIRONMENT" = "github-hosted" ]; then
              sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
                          /usr/share/dotnet /opt/ghc
            fi
          } &
          cleanup=$!
          docker compose -f infra/docker-compose.yml pull --quiet \
            opensearch ollama postgres keycloak jaeger &
          pull=$!
          wait "$cleanup"
          wait "$pull"
          df -h /
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # `ollama-init` is a one-shot job nothing else depends on, unlike
      # `airflow-init` -- `up --wait` treats any container that exits
      # during its convergence check as a failure unless another service
      # vouches for that exit via `depends_on: condition:
      # service_completed_successfully` (docker/compose#10596, reproduced
      # live in this project's own CI: exit code 0, but `up --wait` still
      # returned 1). Fix is Compose's own documented pattern: exclude it
      # from the health-waited bring-up, start it separately, then block on
      # its own exit code with `compose wait`.
      # postgres/keycloak/jaeger come along via api's depends_on --
      # ai/'s TestAnswerDenial submits a real application and decides a
      # real determination through the live API under real Keycloak
      # tokens, so those three are genuinely required, unlike the seven
      # services this job no longer starts at all.
      - run: |
          docker compose -f infra/docker-compose.yml up -d --build --wait opensearch ollama api
          docker compose -f infra/docker-compose.yml up -d ollama-init
          docker compose -f infra/docker-compose.yml wait ollama-init
      - run: free -h
      # The Analytics Copilot (Task 5) shells out to data-platform's own
      # `mf`/`dbt` binaries (see the `ai` job above) -- needed here too,
      # since this is a separate job with its own checkout/venv state.
      - run: cd data-platform && uv sync --dev
      # Provisions its own corpus index + search pipeline against the
      # OpenSearch/Ollama services above (conftest.py's indexed_corpus
      # fixture) -- no separate setup step needed here.
      - run: cd ai && uv sync --dev && uv run pytest -m e2e
      # Ollama (running as root in its container) writes its own identity
      # key and an internal cache file into this bind mount at 0600 --
      # real failure hit live (2026-08-23): actions/cache's save step runs
      # as the unprivileged `runner` user and can't read root-owned 0600
      # files, so it warned "Permission denied" and skipped saving -- the
      # job still went green (a cache-save failure doesn't fail the job),
      # but the cache never populated, quietly defeating the point of
      # caching it. `if: always()` so a failed test run still leaves a
      # saveable cache behind.
      # Paired with the cache step above and gated the same way: this
      # exists only so actions/cache's save step can read root-owned files,
      # so with no cache step there is nothing for it to enable. The path
      # it names is also the GitHub-hosted one -- on the VM the models are
      # at /opt/ollama-models and `infra/ollama-models` does not exist.
      - if: always() && runner.environment == 'github-hosted'
        run: sudo chmod -R a+rX infra/ollama-models
      - if: always()
        run: df -h / && free -h && docker stats --no-stream
      # ml-commons emits a byte-for-byte identical "Memory Circuit Breaker
      # is open" message for all three of its breakers -- JVM heap, host
      # memory, and free disk -- so every one of this project's several such
      # failures has cost a round of inference to attribute, and one of
      # those rounds reached the wrong conclusion. This makes the next
      # failure name itself: the thresholds actually in force, the heap
      # actually in use, and OpenSearch's own account of which breaker
      # tripped.
      - name: Diagnose OpenSearch's circuit breakers on failure
        if: failure()
        run: |
          # `|| true` on each: an unreachable or dead OpenSearch is itself a
          # diagnosis, and must not stop the two checks after it from running.
          curl -s 'http://localhost:9200/_cluster/settings?flat_settings=true&include_defaults=true' \
            | jq '[paths(scalars) as $p | ($p | map(tostring) | join(".")) as $k
                   | select($k | test("ml_commons.*threshold|breaker")) | {($k): getpath($p)}] | add' || true
          curl -s 'http://localhost:9200/_nodes/stats/jvm,breaker' \
            | jq '.nodes[] | {heap_used_percent: .jvm.mem.heap_used_percent,
                              heap_max_in_bytes: .jvm.mem.heap_max_in_bytes,
                              breakers: (.breakers | with_entries(.value |= {limit_size, estimated_size, tripped}))}' || true
          docker compose -f infra/docker-compose.yml logs --no-color --tail=200 opensearch || true
      - if: always()
        run: docker compose -f infra/docker-compose.yml logs --no-color > compose-logs-ai.txt
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs-ai
          path: compose-logs-ai.txt

  ai-eval:
    name: Eval-suite gate -- Policy Q&A
    runs-on: ${{ fromJSON(vars.CI_HEAVY_RUNNER || '"ubuntu-latest"') }}
    # Measured live (2026-08-24), on an otherwise-idle host: the original
    # 8-question CI-gate subset took 13:41 end to end (retrieval + local
    # Ollama generation, sequential -- concurrency here live-tripped
    # OpenSearch's memory circuit breaker in seconds -- pipelined against
    # OpenRouter-judged scoring, which overlaps). An earlier attempt on a
    # *loaded* host (other local commands running concurrently) took 49
    # minutes before timing out outright, which is why this job's own
    # steps below run nothing else alongside it. This job's own first real
    # CI run then hit the same class of failure on the actual runner (a
    # real Ollama generation httpx.ReadTimeout at the old 240s ceiling --
    # see config.py's ollama_timeout_seconds, raised 240 -> 480 in
    # response), so the original 35min budget already carried real margin
    # for retries, not just the one clean local run.
    #
    # 45min, raised 2026-08-26 alongside `_CI_GATE_QUESTIONS` growing
    # 8 -> 12 questions (run_eval.py module docstring point 6): +4
    # questions at the measured ~1.3min/question retrieval+generation cost
    # is +~5min, and this VM's RAM just doubled (D2s_v7 -> D4s_v7, same
    # commit) which should reduce, not increase, retry-driven overruns --
    # so the added budget is proportional headroom, not a response to a
    # new slowdown.
    timeout-minutes: 45
    needs: [changes, ai, start-runner]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.ai_eval == 'true'
    steps:
      - uses: actions/checkout@v7
      # GitHub-hosted only. On a persistent runner this step is not just
      # unnecessary but actively expensive: it moved ~2.3GB through the
      # network on both legs to restore and re-save files that never left
      # the machine, costing 389s of the 2687s total in run 32927971610
      # (14%) plus NAT Gateway data-processing charges in both directions.
      # The VM keeps the same models at /opt/ollama-models instead, via
      # OLLAMA_MODELS_DIR -- see infra/azure/ci-runner/cloud-init.yaml.
      - if: runner.environment == 'github-hosted'
        uses: actions/cache@v6
        with:
          path: infra/ollama-models
          key: ollama-models-nomic-embed-text-llama3.2-3b-v1
      - name: Free disk space and pull images concurrently
        run: |
          # Deleting preinstalled toolchains is GitHub-hosted only: none of
          # these paths exist on the Azure VM, where disk is instead managed
          # by the runner's own pre-job prune hook. Branched inside the step
          # rather than split into a separate gated step, so the deletion
          # still overlaps the pull on GitHub-hosted runners -- which is the
          # whole reason this step has the shape it does.
          {
            if [ "$RUNNER_ENVIRONMENT" = "github-hosted" ]; then
              sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
                          /usr/share/dotnet /opt/ghc
            fi
          } &
          cleanup=$!
          docker compose -f infra/docker-compose.yml pull --quiet opensearch ollama &
          pull=$!
          wait "$cleanup"
          wait "$pull"
          # Free disk is one of ml-commons' three identically-worded
          # breakers, so a baseline on green runs is what makes a red one
          # readable -- same reason e2e-ai prints it here.
          df -h /
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: |
          docker compose -f infra/docker-compose.yml up -d --build --wait opensearch ollama
          docker compose -f infra/docker-compose.yml up -d ollama-init
          docker compose -f infra/docker-compose.yml wait ollama-init
      - run: cd ai && uv sync --dev
      # run_eval.py has no pytest fixture to provision the corpus for it
      # (unlike the e2e-ai job's own indexed_corpus fixture) -- these two
      # steps are that fixture's own setup, run explicitly here.
      #
      # Order matters, and this job originally had it backwards. The
      # fixture indexes *first* and provisions the search pipeline
      # *second* (ai/tests/conftest.py's `indexed_corpus`); this job did
      # the reverse, which meant the ~90MB ONNX reranker sat resident in
      # OpenSearch's 2g heap for the whole 46-second indexing burst
      # instead of being loaded after it. Direct A/B evidence from one
      # run (32808001972, both jobs on the same commit and runner type):
      # e2e-ai passed while running six containers at 7.1Gi/7.8Gi host
      # memory and 865Mi of swap, and this job failed on its very first
      # hybrid_search with two containers and far more headroom -- which
      # rules out host memory as the differentiator and leaves the
      # ordering as the real one. Matched to the sequence that is
      # actually observed green.
      - run: cd ai && uv run python -m canopica_ai.policy_intelligence.corpus.index
      - run: cd ai && uv run python -m canopica_ai.policy_intelligence.corpus.search_pipeline
      # CANOPICA_OTEL_ENABLED=false: this job never starts Jaeger (only
      # opensearch/ollama above, to protect its own tight wall-clock
      # budget) but run_eval.py exercises every traced call site for
      # real -- see canopica_ai.config.Settings.otel_enabled's own docstring
      # for what this avoided, confirmed live in CI run 32803875411.
      - run: cd ai && uv run python -m canopica_ai.policy_intelligence.eval.run_eval --check
        env:
          CANOPICA_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CANOPICA_OTEL_ENABLED: "false"
      # Paired with the cache step above and gated the same way: this
      # exists only so actions/cache's save step can read root-owned files,
      # so with no cache step there is nothing for it to enable. The path
      # it names is also the GitHub-hosted one -- on the VM the models are
      # at /opt/ollama-models and `infra/ollama-models` does not exist.
      - if: always() && runner.environment == 'github-hosted'
        run: sudo chmod -R a+rX infra/ollama-models
      # Identical to the e2e-ai job's own two diagnostic steps, and here for
      # a reason worth stating rather than leaving as duplication: those
      # steps were added when the ml-commons circuit breaker kept tripping
      # in e2e-ai, and this job did not exist yet. It was added later (Task
      # 7) running the same OpenSearch + reranker + corpus-index workload,
      # and inherited none of them -- so when the same breaker tripped here
      # for real (run 32808001972, on the first hybrid_search call, five
      # seconds in), the failure was once again unattributable: ml-commons
      # emits a byte-for-byte identical "Memory Circuit Breaker is open"
      # message for all three of its breakers (JVM heap, host memory, free
      # disk), which is exactly the ambiguity these steps exist to resolve.
      - if: always()
        run: df -h / && free -h && docker stats --no-stream
      - name: Diagnose OpenSearch's circuit breakers on failure
        if: failure()
        run: |
          # `|| true` on each: an unreachable or dead OpenSearch is itself a
          # diagnosis, and must not stop the two checks after it from running.
          curl -s 'http://localhost:9200/_cluster/settings?flat_settings=true&include_defaults=true' \
            | jq '[paths(scalars) as $p | ($p | map(tostring) | join(".")) as $k
                   | select($k | test("ml_commons.*threshold|breaker")) | {($k): getpath($p)}] | add' || true
          curl -s 'http://localhost:9200/_nodes/stats/jvm,breaker' \
            | jq '.nodes[] | {heap_used_percent: .jvm.mem.heap_used_percent,
                              heap_max_in_bytes: .jvm.mem.heap_max_in_bytes,
                              breakers: (.breakers | with_entries(.value |= {limit_size, estimated_size, tripped}))}' || true
          docker compose -f infra/docker-compose.yml logs --no-color --tail=200 opensearch || true
      - if: always()
        run: docker compose -f infra/docker-compose.yml logs --no-color > compose-logs-ai-eval.txt
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs-ai-eval
          path: compose-logs-ai-eval.txt

  # `if: always()` so this still deallocates when any job above fails or
  # times out -- billing runs on wall-clock VM uptime, not job outcome. The
  # `needs.start-runner.result == 'success'` guard is the other half: if
  # `start-runner` itself failed (Azure outage, expired federation), the VM
  # was likely never actually started, and `always()` alone would otherwise
  # still run this job and attempt to deallocate a VM nothing here started.
  # `needs` lists every job that now runs on the self-hosted VM -- not just
  # the original 3 heavy ones -- so this waits for all of them before
  # powering it off.
  stop-runner:
    name: Stop self-hosted CI runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [
        start-runner,
        java,
        web,
        python,
        ai,
        worker,
        audit-chain,
        dbt,
        reporting,
        terraform,
        e2e-data-platform,
        e2e-ai,
        ai-eval,
      ]
    if: always() && needs.start-runner.result == 'success'
    permissions:
      id-token: write
      contents: read
    steps:
      # Gated identically to start-runner. Note this job's `if:` above is
      # `always() && needs.start-runner.result == 'success'` -- a no-op
      # start-runner still reports success, so this still runs and still
      # no-ops, which is the intended symmetry.
      - if: env.CI_USES_SELF_HOSTED == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - if: env.CI_USES_SELF_HOSTED == 'true'
        run: az vm deallocate --resource-group canopica-ci-runner-rg --name canopica-ci-runner-vm

  terraform:
    name: Reference Terraform for Azure (validate only)
    runs-on: ${{ fromJSON(vars.CI_LIGHT_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    needs: [start-runner]
    defaults:
      run:
        working-directory: infra/azure
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.15.8'
          # The default wrapper is a Node.js shim that captures each
          # command's stdout into a step output -- nothing below has an
          # `id:` or reads `steps.*.outputs`, so it's dead weight here, and
          # this runner has no Node.js installed (unlike ubuntu-latest,
          # which bundles it for other actions). Failed outright with
          # "env: node: No such file or directory" on the first run this
          # job executed on canopica-heavy (run 32924144504) before this
          # was set.
          terraform_wrapper: false
      - run: terraform fmt -check
      - run: terraform init -backend=false
      # No plan/apply -- infra/azure/README.md states why (no subscription,
      # no state backend, reference-only). validate catches type/reference
      # errors without needing either.
      - run: terraform validate
