name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pushing a follow-up commit supersedes the run already in flight -- without
# this, a quick series of commits queues several full ~20min e2e runs whose
# results nobody will read anyway, delaying the one that matters and burning
# this private repo's finite Actions minutes.
#
# But *not on main*, and that exception is the whole point of this setting.
# On a PR branch only the latest commit's verdict matters, so superseding is
# free. On main, every commit is a permanent part of history and STATUS.md
# records a per-commit result, so a cancelled run means a commit that is
# merged and unverified -- and cancellation is not free either way, because
# whichever run gets killed has usually already paid the expensive part.
#
# This has now happened twice, both times self-inflicted by a docs-only
# push landing while a real run was mid-flight (runs 32806255794 and
# 32811724784, each killing a run that was minutes from a verdict on a real
# fix). The first was mistakenly treated as fixed by adding `.claude/` to
# the docs filter below -- that stops a docs commit from *running* the
# expensive jobs, but this block is evaluated at workflow level before any
# of that, so the previous run was still cancelled. Filtering the jobs was
# never going to fix a cancellation that happens above the jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # This repo's own convention commits docs/STATUS.md constantly (often as
  # its own commit, e.g. recording a CI result), and each of those was
  # triggering the full end-to-end Compose stack -- ~20min to prove that
  # unchanged code still behaves unchanged. The eight fast jobs below all
  # still run on a docs-only commit (they total under two minutes, and this
  # project's standard is to verify even a docs-only change); only the two
  # expensive e2e jobs are gated on real code having changed.
  #
  # Deliberately a deny-list, not an allow-list of code paths: a new
  # top-level directory nobody remembered to add here still counts as code
  # and still runs e2e. The failure mode is a wasted run, not a silently
  # skipped one.
  changes:
    name: Detect whether any code changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          else
            before="${{ github.event.before }}"
            if [ -n "$before" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
              changed=$(git diff --name-only "$before" HEAD)
            else
              # First push to a branch, or a force-push that orphaned the
              # old tip: no reliable diff base, so fall back to running.
              changed=""
            fi
          fi
          echo "Changed files:"
          echo "$changed"
          # Empty (unknown diff base) deliberately falls through to `true`.
          # `.claude/` is in the docs side of this list because it holds only
          # local developer tooling -- skills (markdown) and a commit-time
          # hook CI never executes -- so nothing under it can change a job's
          # result. It is listed explicitly because the `[^/]*\.md$` branch
          # only ever matches *top-level* markdown: a nested file like
          # `.claude/skills/canopica-task-checkpoint/SKILL.md` matched neither
          # branch and so counted as code, which really happened (run
          # 32808001972) -- a pure-docs commit queued the full ~20min e2e
          # suite and, via `cancel-in-progress` above, killed the run that
          # was mid-way through proving the previous commit green.
          if [ -z "$changed" ] || echo "$changed" | grep -qvE '^(docs/|\.claude/|[^/]*\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  java:
    name: Java (portal + rules engine)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Testcontainers tests (Task 2 onward) use the runner's own Docker daemon.
      - run: ./mvnw -B verify

  web:
    name: Web (React portal)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: portal/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portal/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  python:
    name: Python (data platform)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: data-platform
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest -m "not e2e and not integration"

  ai:
    name: Python (AI capability layer)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      # The Analytics Copilot (Task 5) shells out to data-platform's own
      # already-built `mf`/`dbt` binaries rather than re-vendoring
      # dbt-metricflow's dependency stack a second time (config.py's own
      # comment on `mf_binary_path`) -- a real cross-project coupling, so
      # this job needs that project's venv to exist too, not just its own.
      - run: uv sync --dev
        working-directory: data-platform
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest -m "not e2e"

  audit-chain:
    name: Audit chain verifier (integration)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: data-platform
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run pytest -m integration tests/test_verify_chain.py

  dbt:
    name: Bronze ingestion + dbt silver/gold (integration)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: data-platform
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run pytest -m integration tests/test_extract.py tests/test_dbt_build.py tests/test_mart_processing_timeliness.py tests/test_tokenize.py

  reporting:
    name: Serving-layer materialization (integration)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: data-platform
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run pytest -m integration tests/test_materialize.py

  # Split from one serial job into two parallel ones (2026-08-23). The
  # combined job spent ~21min: it stood up all 14 services, ran
  # data-platform's e2e, then STOPPED seven of them and ran ai/'s e2e --
  # each suite waiting on services the other one needs and it never
  # touches. Verified from the suites' own port usage: data-platform's e2e
  # hits portal-api/portal-web/metabase/keycloak/airflow/jaeger and never
  # OpenSearch or Ollama; ai/'s hits OpenSearch/Ollama/portal-api and never
  # Metabase/Airflow/Grafana/portal-web. Running them side by side on lean
  # stacks makes wall-clock max(a, b) instead of a + b, and drops the two
  # heaviest services (OpenSearch's 2g heap, Ollama's ~3GB model) out of
  # the data-platform job entirely -- which also removes, structurally,
  # the memory contention behind this task's own three-times-recurring
  # "Memory Circuit Breaker is open" failures, rather than continuing to
  # tune margins around it.
  e2e-data-platform:
    name: End-to-end -- data platform
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [changes, java, python, dbt]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      # Deleting preinstalled toolchains this repo uses nowhere (disk-bound,
      # and needed because the Compose images don't fit alongside them) and
      # pulling this job's images (network-bound) are independent, so they
      # run concurrently rather than back to back -- see the same step in
      # `e2e-ai` below for the measurements behind it.
      - name: Free disk space and pull images concurrently
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
                      /usr/share/dotnet /opt/ghc &
          cleanup=$!
          docker compose -f infra/docker-compose.yml pull --quiet \
            postgres metabase keycloak jaeger prometheus grafana &
          pull=$!
          wait "$cleanup"
          wait "$pull"
          df -h /
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # postgres/keycloak/jaeger/airflow-init come along via depends_on.
      # No `ollama-init` here, so none of the docker/compose#10596
      # one-shot-service handling the ai job below still needs.
      - run: docker compose -f infra/docker-compose.yml up -d --build --wait portal-api portal-web metabase prometheus grafana airflow-webserver airflow-scheduler
      - run: cd data-platform && uv sync --dev && uv run pytest -m e2e
      - if: always()
        run: docker compose -f infra/docker-compose.yml logs --no-color > compose-logs-data-platform.txt
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs-data-platform
          path: compose-logs-data-platform.txt

  e2e-ai:
    name: End-to-end -- AI layer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, java, ai]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      # ollama-init pulls ~2.3GB (nomic-embed-text + llama3.2:3b) from
      # Ollama's registry on every run otherwise. infra/docker-compose.yml
      # bind-mounts this exact path (not a named volume, which has no
      # stable host path across separate runs) so it can be cached here.
      # `ollama pull` is content-addressed and idempotent -- a warm cache
      # just verifies existing blobs in seconds. Static key, not a hash of
      # the compose file: that file changes for unrelated reasons far more
      # often than the pulled model tags do. Bump the suffix if
      # ollama-init's own pull list ever changes.
      - uses: actions/cache@v6
        with:
          path: infra/ollama-models
          key: ollama-models-nomic-embed-text-llama3.2-3b-v1
      # Two independent costs that used to run back to back, measured on the
      # last green run: deleting ~17GB of preinstalled toolchains this repo
      # uses nowhere (83s, disk-bound, and needed because the Compose images
      # don't fit alongside them) and pulling this job's ~10GB of images
      # (91s, network-bound). Serially that's 174s of the ~350s this job
      # spends before its first test runs; concurrently it's max(83, 91).
      # Largest directory first so the headroom the pull needs is freed
      # early rather than at the end.
      - name: Free disk space and pull images concurrently
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
                      /usr/share/dotnet /opt/ghc &
          cleanup=$!
          docker compose -f infra/docker-compose.yml pull --quiet \
            opensearch ollama postgres keycloak jaeger &
          pull=$!
          wait "$cleanup"
          wait "$pull"
          df -h /
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # `ollama-init` is a one-shot job nothing else depends on, unlike
      # `airflow-init` -- `up --wait` treats any container that exits
      # during its convergence check as a failure unless another service
      # vouches for that exit via `depends_on: condition:
      # service_completed_successfully` (docker/compose#10596, reproduced
      # live in this project's own CI: exit code 0, but `up --wait` still
      # returned 1). Fix is Compose's own documented pattern: exclude it
      # from the health-waited bring-up, start it separately, then block on
      # its own exit code with `compose wait`.
      # postgres/keycloak/jaeger come along via portal-api's depends_on --
      # ai/'s TestAnswerDenial submits a real application and decides a
      # real determination through the live portal API under real Keycloak
      # tokens, so those three are genuinely required, unlike the seven
      # services this job no longer starts at all.
      - run: |
          docker compose -f infra/docker-compose.yml up -d --build --wait opensearch ollama portal-api
          docker compose -f infra/docker-compose.yml up -d ollama-init
          docker compose -f infra/docker-compose.yml wait ollama-init
      - run: free -h
      # The Analytics Copilot (Task 5) shells out to data-platform's own
      # `mf`/`dbt` binaries (see the `ai` job above) -- needed here too,
      # since this is a separate job with its own checkout/venv state.
      - run: cd data-platform && uv sync --dev
      # Provisions its own corpus index + search pipeline against the
      # OpenSearch/Ollama services above (conftest.py's indexed_corpus
      # fixture) -- no separate setup step needed here.
      - run: cd ai && uv sync --dev && uv run pytest -m e2e
      # Ollama (running as root in its container) writes its own identity
      # key and an internal cache file into this bind mount at 0600 --
      # real failure hit live (2026-08-23): actions/cache's save step runs
      # as the unprivileged `runner` user and can't read root-owned 0600
      # files, so it warned "Permission denied" and skipped saving -- the
      # job still went green (a cache-save failure doesn't fail the job),
      # but the cache never populated, quietly defeating the point of
      # caching it. `if: always()` so a failed test run still leaves a
      # saveable cache behind.
      - if: always()
        run: sudo chmod -R a+rX infra/ollama-models
      - if: always()
        run: df -h / && free -h && docker stats --no-stream
      # ml-commons emits a byte-for-byte identical "Memory Circuit Breaker
      # is open" message for all three of its breakers -- JVM heap, host
      # memory, and free disk -- so every one of this project's several such
      # failures has cost a round of inference to attribute, and one of
      # those rounds reached the wrong conclusion. This makes the next
      # failure name itself: the thresholds actually in force, the heap
      # actually in use, and OpenSearch's own account of which breaker
      # tripped.
      - name: Diagnose OpenSearch's circuit breakers on failure
        if: failure()
        run: |
          # `|| true` on each: an unreachable or dead OpenSearch is itself a
          # diagnosis, and must not stop the two checks after it from running.
          curl -s 'http://localhost:9200/_cluster/settings?flat_settings=true&include_defaults=true' \
            | jq '[paths(scalars) as $p | ($p | map(tostring) | join(".")) as $k
                   | select($k | test("ml_commons.*threshold|breaker")) | {($k): getpath($p)}] | add' || true
          curl -s 'http://localhost:9200/_nodes/stats/jvm,breaker' \
            | jq '.nodes[] | {heap_used_percent: .jvm.mem.heap_used_percent,
                              heap_max_in_bytes: .jvm.mem.heap_max_in_bytes,
                              breakers: (.breakers | with_entries(.value |= {limit_size, estimated_size, tripped}))}' || true
          docker compose -f infra/docker-compose.yml logs --no-color --tail=200 opensearch || true
      - if: always()
        run: docker compose -f infra/docker-compose.yml logs --no-color > compose-logs-ai.txt
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs-ai
          path: compose-logs-ai.txt

  ai-eval:
    name: Eval-suite gate -- Policy Q&A
    runs-on: ubuntu-latest
    # Measured live (2026-08-24), on an otherwise-idle host: the 8-question
    # CI-gate subset (see run_eval.py's own _CI_GATE_QUESTIONS) took 13:41
    # end to end (retrieval + local Ollama generation, sequential --
    # concurrency here live-tripped OpenSearch's memory circuit breaker in
    # seconds -- pipelined against OpenRouter-judged scoring, which
    # overlaps). An earlier attempt on a *loaded* host (other local
    # commands running concurrently) took 49 minutes before timing out
    # outright, which is why this job's own steps below run nothing else
    # alongside it. This job's own first real CI run then hit the same
    # class of failure on the actual runner (a real Ollama generation
    # httpx.ReadTimeout at the old 240s ceiling -- see config.py's
    # ollama_timeout_seconds, raised 240 -> 480 in response), so this
    # budget carries real margin for up to 8 questions each potentially
    # needing a grounding retry (2 generation calls) at the new,
    # higher per-call ceiling, not just the one clean local run.
    timeout-minutes: 35
    needs: [changes, ai]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: infra/ollama-models
          key: ollama-models-nomic-embed-text-llama3.2-3b-v1
      - name: Free disk space and pull images concurrently
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
                      /usr/share/dotnet /opt/ghc &
          cleanup=$!
          docker compose -f infra/docker-compose.yml pull --quiet opensearch ollama &
          pull=$!
          wait "$cleanup"
          wait "$pull"
          # Free disk is one of ml-commons' three identically-worded
          # breakers, so a baseline on green runs is what makes a red one
          # readable -- same reason e2e-ai prints it here.
          df -h /
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: |
          docker compose -f infra/docker-compose.yml up -d --build --wait opensearch ollama
          docker compose -f infra/docker-compose.yml up -d ollama-init
          docker compose -f infra/docker-compose.yml wait ollama-init
      - run: cd ai && uv sync --dev
      # run_eval.py has no pytest fixture to provision the corpus for it
      # (unlike the e2e-ai job's own indexed_corpus fixture) -- these two
      # steps are that fixture's own setup, run explicitly here.
      #
      # Order matters, and this job originally had it backwards. The
      # fixture indexes *first* and provisions the search pipeline
      # *second* (ai/tests/conftest.py's `indexed_corpus`); this job did
      # the reverse, which meant the ~90MB ONNX reranker sat resident in
      # OpenSearch's 2g heap for the whole 46-second indexing burst
      # instead of being loaded after it. Direct A/B evidence from one
      # run (32808001972, both jobs on the same commit and runner type):
      # e2e-ai passed while running six containers at 7.1Gi/7.8Gi host
      # memory and 865Mi of swap, and this job failed on its very first
      # hybrid_search with two containers and far more headroom -- which
      # rules out host memory as the differentiator and leaves the
      # ordering as the real one. Matched to the sequence that is
      # actually observed green.
      - run: cd ai && uv run python -m canopica_ai.policy_intelligence.corpus.index
      - run: cd ai && uv run python -m canopica_ai.policy_intelligence.corpus.search_pipeline
      # CANOPICA_OTEL_ENABLED=false: this job never starts Jaeger (only
      # opensearch/ollama above, to protect its own tight wall-clock
      # budget) but run_eval.py exercises every traced call site for
      # real -- see canopica_ai.config.Settings.otel_enabled's own docstring
      # for what this avoided, confirmed live in CI run 32803875411.
      - run: cd ai && uv run python -m canopica_ai.policy_intelligence.eval.run_eval --check
        env:
          CANOPICA_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CANOPICA_OTEL_ENABLED: "false"
      - if: always()
        run: sudo chmod -R a+rX infra/ollama-models
      # Identical to the e2e-ai job's own two diagnostic steps, and here for
      # a reason worth stating rather than leaving as duplication: those
      # steps were added when the ml-commons circuit breaker kept tripping
      # in e2e-ai, and this job did not exist yet. It was added later (Task
      # 7) running the same OpenSearch + reranker + corpus-index workload,
      # and inherited none of them -- so when the same breaker tripped here
      # for real (run 32808001972, on the first hybrid_search call, five
      # seconds in), the failure was once again unattributable: ml-commons
      # emits a byte-for-byte identical "Memory Circuit Breaker is open"
      # message for all three of its breakers (JVM heap, host memory, free
      # disk), which is exactly the ambiguity these steps exist to resolve.
      - if: always()
        run: df -h / && free -h && docker stats --no-stream
      - name: Diagnose OpenSearch's circuit breakers on failure
        if: failure()
        run: |
          # `|| true` on each: an unreachable or dead OpenSearch is itself a
          # diagnosis, and must not stop the two checks after it from running.
          curl -s 'http://localhost:9200/_cluster/settings?flat_settings=true&include_defaults=true' \
            | jq '[paths(scalars) as $p | ($p | map(tostring) | join(".")) as $k
                   | select($k | test("ml_commons.*threshold|breaker")) | {($k): getpath($p)}] | add' || true
          curl -s 'http://localhost:9200/_nodes/stats/jvm,breaker' \
            | jq '.nodes[] | {heap_used_percent: .jvm.mem.heap_used_percent,
                              heap_max_in_bytes: .jvm.mem.heap_max_in_bytes,
                              breakers: (.breakers | with_entries(.value |= {limit_size, estimated_size, tripped}))}' || true
          docker compose -f infra/docker-compose.yml logs --no-color --tail=200 opensearch || true
      - if: always()
        run: docker compose -f infra/docker-compose.yml logs --no-color > compose-logs-ai-eval.txt
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs-ai-eval
          path: compose-logs-ai-eval.txt

  terraform:
    name: Reference Terraform for Azure (validate only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/azure
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.15.8'
      - run: terraform fmt -check
      - run: terraform init -backend=false
      # No plan/apply -- infra/azure/README.md states why (no subscription,
      # no state backend, reference-only). validate catches type/reference
      # errors without needing either.
      - run: terraform validate
