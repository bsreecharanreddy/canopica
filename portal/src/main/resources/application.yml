spring:
  application:
    name: ies-portal
  datasource:
    url: ${IES_OPERATIONAL_JDBC_URL:jdbc:postgresql://localhost:5432/ies_operational}
    username: ${IES_OPERATIONAL_USER:ies_app}
    password: ${IES_OPERATIONAL_PASSWORD:ies_app}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Substituted into V6__audit_event.sql, so the role the grants apply to is
    # the role the application actually connects as.
    placeholders:
      app_role: ${IES_OPERATIONAL_USER:ies_app}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

ies:
  # Benefit months, effective dating, and the annual October parameter change
  # are all civil-calendar concepts; pin the zone rather than inherit the host's.
  timezone: America/New_York
  keycloak:
    # issuer-uri is a comparison string, not a URL this app ever connects to
    # -- it's what Keycloak actually stamps into every token's `iss` claim,
    # which is always the address the *token-requesting* caller (browser,
    # test, or the synthetic-data loader) used to reach Keycloak. Every one
    # of those callers runs on the host, never inside the Compose network,
    # so this stays localhost:8081 in both local dev and Docker Compose --
    # unlike jwks-uri below, it does not get overridden per environment.
    workers-issuer-uri: ${IES_KEYCLOAK_WORKERS_ISSUER_URI:http://localhost:8081/realms/ies-workers}
    citizens-issuer-uri: ${IES_KEYCLOAK_CITIZENS_ISSUER_URI:http://localhost:8081/realms/ies-citizens}
    # jwks-uri is a real network address this app fetches signing keys from
    # -- unlike issuer-uri, it must actually be reachable from wherever
    # portal-api itself runs. Local (non-Docker) dev default matches the
    # issuer above; infra/docker-compose.yml overrides both jwks-uri env
    # vars to the container-network hostname, since portal-api can't reach
    # "localhost:8081" meaningfully from inside its own container.
    workers-jwks-uri: ${IES_KEYCLOAK_WORKERS_JWKS_URI:${ies.keycloak.workers-issuer-uri}/protocol/openid-connect/certs}
    citizens-jwks-uri: ${IES_KEYCLOAK_CITIZENS_JWKS_URI:${ies.keycloak.citizens-issuer-uri}/protocol/openid-connect/certs}
